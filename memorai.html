<script>
(function(){
  if (window.storage) return;
  var ok=false, mem={};
  try{ window.localStorage.setItem('__mt','1'); window.localStorage.removeItem('__mt'); ok=true; }catch(e){}
  var LS = ok ? window.localStorage : {
    getItem:function(k){return (k in mem)?mem[k]:null;},
    setItem:function(k,v){mem[k]=String(v);},
    removeItem:function(k){delete mem[k];},
    key:function(i){return Object.keys(mem)[i];},
    get length(){return Object.keys(mem).length;}
  };
  window.storage = {
    get:function(k){var v=LS.getItem(k);return Promise.resolve(v===null?null:{key:k,value:v});},
    set:function(k,v){LS.setItem(k,v);return Promise.resolve({key:k,value:v});},
    delete:function(k){LS.removeItem(k);return Promise.resolve({key:k,deleted:true});},
    list:function(p){var ks=[];for(var i=0;i<LS.length;i++){var kk=LS.key(i);if(!p||kk.indexOf(p)===0)ks.push(kk);}return Promise.resolve({keys:ks});}
  };
})();
</script>

tinci\xF3n de contrastes de color del inspector se repite con periodicidad {{c1::anual}}.",""],["\xBFQu\xE9 es la <b>fatiga mec\xE1nica</b> de un componente?","El fallo generado al operar sometido a esfuerzos que cambian de signo peri\xF3dicamente (tracci\xF3n\u2013compresi\xF3n), en ciclos. Puede fallar con cargas incluso inferiores a la de rotura est\xE1tica, debido a esa alternancia de signo."],["\xBFEn qu\xE9 consiste la <b>fatiga t\xE9rmica</b> y d\xF3nde es caracter\xEDstica?","Ciclos de calentamiento y enfriamiento que dilatan y contraen el material, generando grietas. Caracter\xEDstica de instalaciones de energ\xEDa (tuber\xEDas, calderas, cambiadores) sometidas a ciclos de arranque\u2013parada."],["Antes de que una grieta por fatiga sea detectable a inspecci\xF3n visual puede haberse consumido del {{c1::60% al 90%}} de la vida total de fatiga del elemento.",""],["Diferencia entre <b>desgaste abrasivo por rayado</b> y <b>desgaste erosivo</b>.","Rayado: inclusi\xF3n de peque\xF1os cuerpos duros entre superficies en contacto, deja rayas brillantes en el sentido del desplazamiento relativo.<br>Erosivo: part\xEDculas duras que inciden o resbalan a gran velocidad transportadas por un fluido; da\xF1a por impacto, no por rayado."],["\xBFC\xF3mo reconoce el inspector el <b>desgaste adhesivo</b>?","P\xE9rdida del acabado superficial con peque\xF1os cr\xE1teres poco profundos y puntos con material adherido, arrancado de lugares muy pr\xF3ximos. Ocurre cuando falla la pel\xEDcula lubricante y las partes met\xE1licas entran en contacto."],["Nombra tipos de <b>deformaci\xF3n por sobrecarga est\xE1tica</b> y su origen.","Doblado (flexi\xF3n), torcido (torsi\xF3n), estricci\xF3n (tracci\xF3n axial), pandeo (compresi\xF3n axial), abollado (esfuerzo perpendicular en elementos delgados) y huellas (penetraci\xF3n). El inspector las describe y relaciona con el esfuerzo que las origin\xF3."],["Ventaja del <b>registro fotogr\xE1fico</b> frente al de v\xEDdeo en el examen visual."
