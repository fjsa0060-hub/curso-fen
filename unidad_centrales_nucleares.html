<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidad didáctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420; --surface:#18202E; --surface-2:#1E2738;
    --line:#2C3850; --line-soft:#232E42;
    --ink:#E8ECF4; --ink-soft:#B2BBCC; --ink-faint:#7E889C;

    --comprender:#34C9B6; --comprender-tint:rgba(52,201,182,.13);
    --analizar:#5AA3EC;   --analizar-tint:rgba(90,163,236,.13);
    --aplicar:#EFAC4A;    --aplicar-tint:rgba(239,172,74,.14);
    --evaluar:#EC6F84;    --evaluar-tint:rgba(236,111,132,.14);

    --maxw:1120px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter",system-ui,sans-serif; line-height:1.62;
    font-size:16.5px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}

  /* ---------- HEADER ---------- */
  header.hero{padding:54px 0 26px; border-bottom:1px solid var(--line)}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-family:"Space Mono",monospace;
    font-size:12.5px; letter-spacing:.03em; color:var(--ink-faint); text-decoration:none;
    margin-bottom:18px; transition:color .15s ease;
  }
  .back-link:hover{color:var(--ink-soft)}
  .crumb{
    font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.04em;
    color:var(--ink-faint); text-transform:uppercase; margin-bottom:22px;
  }
  .crumb b{color:var(--ink-soft); font-weight:700}
  .eyebrow{
    font-family:"Space Mono",monospace; font-size:13px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase; color:var(--evaluar);
    margin-bottom:14px;
  }
  h1{
    font-family:"Space Grotesk",sans-serif; font-weight:700;
    font-size:clamp(2rem,5.2vw,3.4rem); line-height:1.05; letter-spacing:-.02em;
    margin:0 0 22px; max-width:18ch; color:var(--ink);
  }
  .meta{display:flex; flex-wrap:wrap; gap:8px 26px; font-size:14px; color:var(--ink-soft)}
  .meta .k{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:2px}
  .ref-obj{
    margin-top:24px; padding:16px 18px; background:var(--surface);
    border:1px solid var(--line); border-left:4px solid var(--evaluar); border-radius:10px;
    font-size:14.5px; max-width:760px; color:var(--ink-soft);
  }
  .ref-obj .k{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:4px}
  .ref-obj em{font-style:normal; color:var(--evaluar); font-weight:600}

  /* ---------- MIND MAP ---------- */
  .mm-section{padding:40px 0 30px}
  .mm-title{font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-faint); text-align:center; margin-bottom:6px}
  .mm-sub{text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 28px}
  .mm-wrap{position:relative; min-height:280px}
  .mm-links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
  .mm-link{fill:none; stroke-width:2.5; opacity:.55}
  .mm-link-comprender{stroke:var(--comprender)}
  .mm-link-analizar{stroke:var(--analizar)}
  .mm-link-aplicar{stroke:var(--aplicar)}
  .mm-link-evaluar{stroke:var(--evaluar)}
  .mm-center{
    position:relative; z-index:1; width:max-content; max-width:340px; margin:0 auto 56px;
    background:var(--surface-2); color:var(--ink); border:1px solid rgba(255,255,255,.10);
    border-radius:16px; padding:18px 24px; text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .mm-center .lbl{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px}
  .mm-center .txt{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:17px; line-height:1.2}
  .mm-nodes{position:relative; z-index:1; display:flex; flex-wrap:wrap; justify-content:center; gap:16px}
  .mm-node{
    flex:1 1 175px; max-width:200px; min-width:150px;
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c);
    border-radius:12px; padding:14px 14px 16px; cursor:pointer; text-align:left;
    font-family:inherit; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .mm-node:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(0,0,0,.5)}
  .mm-node:focus-visible{outline:3px solid var(--c); outline-offset:2px}
  .mm-node.active{box-shadow:0 10px 26px rgba(0,0,0,.5); border-color:var(--c)}
  .mm-node .num{font-family:"Space Mono",monospace; font-size:22px; font-weight:700; color:var(--c); line-height:1}
  .mm-node .lvl{display:inline-block; font-family:"Space Mono",monospace; font-size:10px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--c);
    background:var(--c-tint); border-radius:20px; padding:2px 9px; margin:8px 0 7px}
  .mm-node .nt{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:14.5px; line-height:1.2; color:var(--ink)}
  .lvl-comprender{--c:var(--comprender); --c-tint:var(--comprender-tint)}
  .lvl-analizar{--c:var(--analizar); --c-tint:var(--analizar-tint)}
  .lvl-aplicar{--c:var(--aplicar); --c-tint:var(--aplicar-tint)}
  .lvl-evaluar{--c:var(--evaluar); --c-tint:var(--evaluar-tint)}

  /* ---------- LAYOUT BODY ---------- */
  .body-grid{display:grid; grid-template-columns:200px 1fr; gap:48px; padding:30px 0 80px; align-items:start}
  nav.rail{position:sticky; top:24px; align-self:start}
  .rail-title{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:14px}
  .nav-item{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
    background:none; border:none; cursor:pointer; padding:9px 0; font-family:inherit;
    color:var(--ink-soft); border-top:1px solid var(--line-soft); transition:color .15s}
  .nav-item:hover{color:var(--ink)}
  .nav-item .dot{width:10px; height:10px; border-radius:50%; background:var(--c); margin-top:6px; flex:none}
  .nav-item .ni-txt{font-size:13.5px; line-height:1.3}
  .nav-item .ni-num{font-family:"Space Mono",monospace; font-weight:700; font-size:12px}
  .nav-item.active{color:var(--ink); font-weight:600}
  .nav-item.active .ni-txt{font-weight:600}

  /* ---------- SECTIONS ---------- */
  section.od{scroll-margin-top:20px; margin-bottom:64px; padding-top:6px}
  .od-head{border-left:4px solid var(--c); padding-left:20px; margin-bottom:24px}
  .od-tag{display:inline-flex; align-items:center; gap:8px; font-family:"Space Mono",monospace;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--c);
    background:var(--c-tint); border-radius:20px; padding:4px 12px; margin-bottom:14px}
  .od-tag .n{font-weight:700}
  h2{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:clamp(1.5rem,3vw,2rem);
    line-height:1.14; letter-spacing:-.015em; margin:0 0 14px; color:var(--ink)}
  .objective{background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-size:14.5px; color:var(--ink-soft)}
  .objective .k{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--c); display:block; margin-bottom:5px; font-weight:700}
  .objective b{color:var(--ink); font-weight:600}
  .content{margin-top:26px}
  .content p{margin:0 0 16px; color:var(--ink-soft)}
  .content h3{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.12rem;
    margin:30px 0 10px; color:var(--ink)}
  .lead{font-size:1.08rem; color:var(--ink) !important}
  .content b{color:var(--ink)}

  /* tables */
  .tbl-wrap{overflow-x:auto; margin:22px 0; border:1px solid var(--line); border-radius:12px}
  table{border-collapse:collapse; width:100%; min-width:520px; font-size:14px; background:var(--surface)}
  th,td{text-align:left; padding:12px 15px; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-soft)}
  thead th{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  td b, th b{font-weight:600; color:var(--ink)}
  .yes{color:var(--comprender); font-weight:700}
  .no{color:var(--ink-faint)}

  /* callout */
  .callout{display:flex; gap:14px; background:var(--c-tint); border-radius:12px; padding:16px 18px; margin:22px 0;
    border:1px solid color-mix(in srgb, var(--c) 32%, transparent)}
  .callout .ic{font-family:"Space Mono",monospace; font-weight:700; color:var(--c); font-size:13px;
    letter-spacing:.05em; text-transform:uppercase; flex:none; padding-top:1px}
  .callout p{margin:0; font-size:14.5px; color:var(--ink) !important}
  .aula{--c:var(--analizar); --c-tint:var(--analizar-tint)}

  /* figure / schematic */
  figure{margin:24px 0; border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:22px 18px 14px}
  figure svg{display:block; width:100%; height:auto}
  figure img{display:block; width:100%; height:auto}
  figcaption{font-size:13px; color:var(--ink-soft); text-align:center; margin-top:12px;
    font-family:"Space Mono",monospace; letter-spacing:.02em}

  /* MemorAI — enlace de repaso al final del tema */
  .memorai-promo{padding:34px 0 44px; text-align:center}
  .memorai-promo a{display:inline-flex; flex-direction:column; align-items:center; gap:12px; text-decoration:none}
  .memorai-promo img{display:block; width:160px; height:auto; border-radius:12px;
    transition:transform .15s ease, filter .15s ease}
  .memorai-promo a:hover img{transform:translateY(-3px); filter:brightness(1.08)}
  .memorai-promo .mp-cta{font-family:"Space Mono",monospace; font-size:12.5px; letter-spacing:.04em;
    color:var(--ink-faint); transition:color .15s ease}
  .memorai-promo a:hover .mp-cta{color:var(--ink-soft)}

  /* hueco de imagen pendiente */
  .img-prompt{margin:24px 0; border:1.5px dashed var(--line); border-radius:14px; padding:20px 20px 18px;
    background:color-mix(in srgb, var(--surface) 60%, transparent)}
  .img-prompt .ip-lbl{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px; display:flex; align-items:center; gap:8px}
  .img-prompt .ip-lbl::before{content:"◇"; color:var(--ink-faint)}
  .img-prompt .ip-prompt{font-family:"Space Mono",monospace; font-size:12.5px; line-height:1.6; color:var(--ink-soft);
    white-space:pre-wrap}

  footer{border-top:1px solid var(--line); padding:34px 0 60px; color:var(--ink-faint); font-size:13px;
    font-family:"Space Mono",monospace; letter-spacing:.02em}
  footer .v{color:var(--ink-soft)}

  @media (max-width:860px){
    .body-grid{grid-template-columns:1fr; gap:0}
    nav.rail{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .mm-node{transition:none}
  }

  /* ---------- V2 · FLASHCARDS (datos; el grid inline ya no se renderiza -> ver .mem-od-card) ---------- */
  .check{margin-top:40px; padding-top:28px; border-top:1px solid var(--line)}
  .check-h{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.14rem; color:var(--ink); margin-bottom:4px}
  .check-h .badge{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--c); background:var(--c-tint); border-radius:20px; padding:3px 10px; margin-left:8px; vertical-align:middle}
  .check-sub{font-size:13.5px; color:var(--ink-faint); margin:0 0 20px}
  .fc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:18px}
  /* Tarjeta de acceso a MemorAI al final de cada objetivo -> sustituye a las flashcards inline */
  .mem-od-card{display:flex; align-items:center; gap:16px; text-decoration:none;
    background:var(--surface); border:1px solid var(--c); border-radius:16px; padding:18px 20px;
    transition:filter .15s ease, transform .15s ease, border-color .15s ease}
  .mem-od-card:hover{filter:brightness(1.1); transform:translateY(-2px)}
  .mem-od-icon{flex:none; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--c-tint); color:var(--c)}
  .mem-od-icon svg{width:24px; height:24px}
  .mem-od-txt{flex:1 1 auto; display:flex; flex-direction:column; gap:3px; min-width:0}
  .mem-od-title{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:15.5px; color:var(--ink)}
  .mem-od-sub{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.02em; color:var(--ink-faint)}
  .mem-od-arrow{flex:none; font-size:20px; color:var(--c); transition:transform .15s ease}
  .mem-od-card:hover .mem-od-arrow{transform:translateX(4px)}
  .flip{perspective:1300px; cursor:pointer; min-height:240px; outline:none}
  .flip-inner{position:relative; width:100%; min-height:240px;
    transition:transform .55s cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .flip:focus-visible .face-front{box-shadow:0 0 0 3px var(--c)}
  .face{position:absolute; top:0; left:0; width:100%;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c);
    border-radius:14px; padding:18px 18px 16px}
  .face-back{transform:rotateY(180deg)}
  .fc-tag{display:flex; justify-content:space-between; font-family:"Space Mono",monospace; font-size:10.5px;
    letter-spacing:.06em; text-transform:uppercase; color:var(--c); margin-bottom:11px}
  .fc-q{font-size:15px; font-weight:600; color:var(--ink); line-height:1.4; margin-bottom:13px}
  .fc-opts{list-style:none; margin:0; padding:0; font-size:13.5px; color:var(--ink-soft)}
  .fc-opts li{padding:5px 0 5px 24px; position:relative; line-height:1.4}
  .fc-opts li .ltr{position:absolute; left:0; top:5px; font-family:"Space Mono",monospace; font-weight:700; color:var(--ink-faint)}
  .fc-hint{margin-top:14px; font-family:"Space Mono",monospace; font-size:10.5px; color:var(--ink-faint); text-align:right}
  .fc-correct{display:inline-block; font-family:"Space Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.05em;
    color:var(--c); background:var(--c-tint); border-radius:20px; padding:3px 11px; margin-bottom:11px}
  .fc-ans{font-size:15px; font-weight:600; color:var(--ink); line-height:1.4; margin-bottom:11px}
  .fc-why{font-size:13.5px; color:var(--ink-soft); line-height:1.5}
  .fc-why b{color:var(--ink)}

  /* ---------- V3 · SERIOUS GAME ---------- */
  .game{margin-top:40px; padding:24px 22px 22px; background:var(--surface); border:1px solid var(--line);
    border-top:4px solid var(--c); border-radius:16px}
  .game-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:8px}
  .game-kicker{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--c); margin-bottom:6px}
  .game-title{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:1.18rem; color:var(--ink); margin:0}
  .game-score{font-family:"Space Mono",monospace; font-weight:700; font-size:14px; color:var(--c);
    background:var(--c-tint); border-radius:20px; padding:5px 13px; white-space:nowrap}
  .game-intro{font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5}
  .game-progress{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px}
  .scenario-title{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.04rem; color:var(--ink); margin:0 0 6px}
  .scenario-sit{font-size:14.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 16px}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; cursor:pointer;
    font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line);
    border-radius:11px; padding:13px 15px; transition:border-color .15s, background .15s, transform .1s}
  .opt:hover:not(:disabled){border-color:var(--c); transform:translateY(-1px)}
  .opt:disabled{cursor:default}
  .opt .ob{width:9px; height:9px; border-radius:50%; background:var(--ink-faint); margin-top:5px; flex:none}
  .opt.good{border-color:var(--comprender); background:var(--comprender-tint)}
  .opt.partial{border-color:var(--aplicar); background:var(--aplicar-tint)}
  .opt.bad{border-color:var(--evaluar); background:var(--evaluar-tint)}
  .opt .tag-best{margin-left:auto; align-self:center; flex:none; font-family:"Space Mono",monospace;
    font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--comprender)}
  .feedback{margin-top:14px; padding:13px 15px; border-radius:11px; font-size:13.5px; line-height:1.55; border-left:4px solid var(--c); color:var(--ink-soft)}
  .feedback.good{border-color:var(--comprender); background:var(--comprender-tint)}
  .feedback.partial{border-color:var(--aplicar); background:var(--aplicar-tint)}
  .feedback.bad{border-color:var(--evaluar); background:var(--evaluar-tint)}
  .feedback .fb-verd{font-family:"Space Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:5px}
  .feedback.good .fb-verd{color:var(--comprender)}
  .feedback.partial .fb-verd{color:var(--aplicar)}
  .feedback.bad .fb-verd{color:var(--evaluar)}
  .game-next{margin-top:16px; font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    background:var(--c); color:#1a0b0e; border:none; border-radius:10px; padding:11px 22px; transition:transform .12s, filter .12s}
  .game-next:hover{transform:translateY(-2px); filter:brightness(1.07)}
  .game-result{text-align:center; padding:14px 0 6px}
  .gr-score{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:2.7rem; color:var(--c); line-height:1}
  .gr-of{font-family:"Space Mono",monospace; font-size:12.5px; color:var(--ink-faint); margin-bottom:14px}
  .gr-badge{display:inline-block; font-family:"Space Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; border-radius:20px; padding:5px 14px; margin-bottom:16px}
  .gr-badge.pass{color:var(--comprender); background:var(--comprender-tint)}
  .gr-badge.fail{color:var(--evaluar); background:var(--evaluar-tint)}
  .gr-tier{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.18rem; color:var(--ink); margin-bottom:6px}
  .gr-msg{font-size:14px; color:var(--ink-soft); max-width:480px; margin:0 auto 18px; line-height:1.5}
  .game-restart{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:14px; cursor:pointer; display:inline-block;
    background:transparent; color:var(--c); border:1px solid var(--c); border-radius:10px; padding:10px 22px}
  .game-restart:hover{background:var(--c-tint)}



  /* ---------- FIGURAS AMPLIABLES (figlb v1) ---------- */
  figure{position:relative}
  figure.figlb-able{cursor:zoom-in}
  figure.figlb-able:focus-visible{outline:2px solid var(--analizar); outline-offset:3px}
  figure.figlb-able .figlb-hint{
    position:absolute; top:10px; right:10px; z-index:2;
    display:flex; align-items:center; gap:6px; pointer-events:none;
    font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); background:color-mix(in srgb, var(--bg) 72%, transparent);
    border:1px solid var(--line); border-radius:8px; padding:4px 8px;
    opacity:0; transition:opacity .15s ease, color .15s ease;
  }
  figure.figlb-able:hover .figlb-hint,
  figure.figlb-able:focus-visible .figlb-hint{opacity:1; color:var(--ink-soft)}

  .figlb{
    position:fixed; inset:0; z-index:9999; display:none;
    background:color-mix(in srgb, var(--bg) 94%, #000);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  .figlb.open{display:block}
  body.figlb-lock{overflow:hidden}
  .figlb-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:64px 28px 92px; overflow:hidden; touch-action:none;
  }
  .figlb-pan{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; transform-origin:50% 50%; will-change:transform;
    transition:transform .16s ease-out;
  }
  .figlb-pan.dragging{transition:none; cursor:grabbing}
  .figlb-fit{
    width:100%; max-width:100%; max-height:100%; aspect-ratio:var(--figlb-ar, 16/9);
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px;
  }
  .figlb-fit.raster{width:auto; height:auto; aspect-ratio:auto; padding:10px}
  .figlb-fit svg{display:block; width:100%; height:100%}
  .figlb-fit img{display:block; max-width:calc(100vw - 76px); max-height:calc(100vh - 176px); width:auto; height:auto}

  .figlb-cap{
    position:absolute; left:0; right:0; bottom:26px; margin:0 auto; max-width:74ch; padding:0 28px;
    font-family:"Space Mono",monospace; font-size:13px; line-height:1.5; color:var(--ink-soft);
    text-align:center; pointer-events:none;
  }
  .figlb-bar{
    position:absolute; top:18px; right:22px; display:flex; align-items:center; gap:8px; z-index:2;
  }
  .figlb-bar button{
    display:flex; align-items:center; justify-content:center; min-width:38px; height:38px; padding:0 11px;
    background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:10px;
    font-family:"Space Mono",monospace; font-size:15px; line-height:1; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .figlb-bar button:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink-faint)}
  .figlb-bar button:disabled{opacity:.4; cursor:default}
  .figlb-bar .figlb-lvl{
    min-width:56px; text-align:center; font-family:"Space Mono",monospace; font-size:12px;
    color:var(--ink-faint); letter-spacing:.04em;
  }
  .figlb-help{
    position:absolute; left:22px; top:26px; font-family:"Space Mono",monospace; font-size:11.5px;
    letter-spacing:.04em; color:var(--ink-faint); pointer-events:none;
  }
  @media (max-width:860px){
    .figlb-stage{padding:58px 12px 86px}
    .figlb-help{display:none}
  }

    .figlb-pan{transition:none}
  }

window.UNIT = {"curso": "Fundamentos de Energía Nuclear (FEN)", "modulo": "M2 · Centrales nucleares", "numTema": "2.1", "tema": "Centrales nucleares", "titulo": "Centrales nucleares: la fisión como fuente de calor, tipos PWR y BWR y sus componentes", "tituloPagina": "2.1 Centrales nucleares · FEN", "tituloCorto": "Centrales nucleares", "fuente": "Ciencia y Tecnología Nuclear, Cap. 2 · Centrales nucleares (A. Hinestrosa Magan, J. Sáenz de Santa María Valín — Jóvenes Nucleares, Sociedad Nuclear Española). Datos actualizados: Foro Nuclear (2025), World Nuclear Association (2026) y U.S. NRC", "formato": "documento", "objetivoReferencia": "Explicar cómo una central nuclear convierte el calor de la fisión en electricidad, distinguiendo el recorrido del agua y del vapor en una PWR y en una BWR y la función de cada componente principal.", "objetivoInferido": true, "slug": "centrales_nucleares", "unitHref": "unidad_centrales_nucleares.html", "memoraiHref": "memorai.html", "objetivos": [{"id": "od1", "n": "01", "lvl": "comprender", "lvlLabel": "Comprender", "navTitle": "Cómo se produce la electricidad", "titulo": "Cómo se produce la electricidad: todas giran un alternador", "objetivo": "<b>Explicar</b> qué tienen en común las centrales eléctricas y qué las diferencia, identificando en cada tipo qué hace girar el alternador.", "contentHtml": "<p class='lead'>La electricidad tiene una ventaja que ninguna otra forma de energía iguala: se puede producir en grandes cantidades y llevar sin dificultad hasta fábricas y hogares. El planeta tiene energía de sobra; lo difícil es convertirla en energía útil con el menor impacto ambiental posible.</p><p>Hace poco más de un siglo casi toda la energía venía del músculo de personas y animales y del calor de quemar madera, con algunos molinos de agua y de viento. El salto llegó con la máquina de vapor: James Watt no la inventó, pero sus mejoras de la segunda mitad del siglo XVIII permitieron usarla en miles de aplicaciones y abrieron la Revolución Industrial. A finales del XIX la electricidad empezó a iluminar calles y casas, y acabó siendo el motor de una segunda revolución industrial. Watt da nombre al vatio (W), la unidad de potencia: un kilovatio equivale a 1,36 caballos de vapor.</p><p>Si se mira el final del proceso, casi todas las centrales eléctricas hacen lo mismo: hacen girar una máquina llamada <b>alternador</b> o generador eléctrico. La fotovoltaica es la excepción. Lo que distingue a una central de otra es la manera de conseguir ese giro.</p><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Las centrales eólica, hidroeléctrica, térmica, de ciclo combinado y nuclear producen electricidad haciendo girar un alternador; la fotovoltaica es la excepción\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Las centrales eólica, hidroeléctrica, térmica, de ciclo combinado y nuclear producen electricidad haciendo girar un alternador; la fotovoltaica es la excepción</title><defs><radialGradient id=\"gen-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#132A42\"/><stop offset=\".6\" stop-color=\"#0B1622\"/><stop offset=\"1\" stop-color=\"#060D15\"/></radialGradient><pattern id=\"gen-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"><path d=\"M40 0H0V40\" fill=\"none\" stroke=\"#1E3346\" stroke-width=\"1\" opacity=\".55\"/></pattern><filter id=\"gen-glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"4\" result=\"b\"/><feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter><filter id=\"gen-soft\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"9\"/></filter><filter id=\"gen-blur\"><feGaussianBlur stdDeviation=\"6\"/></filter><marker id=\"gen-arw\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"c  fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" marker-end=\"url(#gen-arw)\"/><rect x=\"1180\" y=\"700\" width=\"360\" height=\"110\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\".85\" stroke=\"#B8C6D6\" stroke-width=\"2\" stroke-dasharray=\"8 7\"/><g transform=\"translate(1210 725)\"><path d=\"M0 60 L18 0 H82 L64 60 Z\" fill=\"#1F3F66\" stroke=\"#9FB0C2\" stroke-width=\"2\"/><path d=\"M6 40 H70 M12 20 H76 M34 0 L22 60 M58 0 L46 60\" stroke=\"#9FB0C2\" stroke-width=\"1.5\"/></g><text x=\"1312\" y=\"738\" font-size=\"19\" font-weight=\"700\" fill=\"#B8C6D6\" font-family=\"Space Mono, Consolas, Menlo, monospace\">FOTOVOLTAICA</text><text x=\"1312\" y=\"766\" font-size=\"17\" fill=\"#B8C6D6\"><tspan x=\"1312\" dy=\"0em\">La excepción: no hace</tspan><tspan x=\"1312\" dy=\"1.35em\">girar ningún alternador</tspan></text><rect x=\"60\" y=\"700\" width=\"500\" height=\"110\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#B47BF0\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M60 718V700H78 M542 700H560V718 M560 792V810H542 M78 810H60V792\" fill=\"none\" stroke=\"#B47BF0\" stroke-width=\"3\" filter=\"url(#gen-glow)\"/><text x=\"80\" y=\"736\" font-size=\"18\" font-weight=\"700\" fill=\"#B47BF0\" font-family=\"Space Mono, Consolas, Menlo, monospace\">LA IDEA COMÚN</text><text x=\"80\" y=\"766\" font-size=\"18\" fill=\"#E6EDF5\"><tspan x=\"80\" dy=\"0em\">fuente → turbina o aspas → eje →</tspan><tspan x=\"80\" dy=\"1.35em\">alternador → electricidad a la red</tspan></text></svg><figcaption>Sigue cada flecha hasta el alternador: cambia la fuente que produce el giro, pero el paso final es el mismo. La fotovoltaica queda fuera del esquema porque no usa alternador.</figcaption></figure><div class=\"tbl-wrap\"><table><thead><tr><th>Tipo de central</th><th>Qué hace girar el alternador</th></tr></thead><tbody><tr><td>Eólica</td><td>El viento mueve unas aspas, y estas giran el alternador.</td></tr><tr><td>Hidroeléctrica</td><td>El agua de la presa, al caer por gravedad, impulsa una turbina.</td></tr><tr><td>Térmica</td><td>La combustión de carbón, gas o petróleo en la caldera, o la radiación solar concentrada con espejos, calienta agua; el vapor mueve la turbina.</td></tr><tr><td>Ciclo combinado</td><td>La combustión de gas mueve una turbina de gas; sus gases de escape, muy calientes, aportan calor a una caldera cuyo vapor mueve una turbina de vapor.</td></tr><tr><td>Nuclear</td><td>El calor de la fisión de átomos, normalmente de uranio, genera el vapor que mueve la turbina.</td></tr></tbody></table></div><div class=\"callout\" style=\"--c:var(--comprender);--c-tint:var(--comprender-tint)\"><span class=\"ic\">Clave</span><p>Según la fuente, la diferencia fundamental entre una central nuclear y el resto está en <b>de dónde sale el calor</b>. Una central térmica quema combustibles fósiles; una nuclear aprovecha la energía almacenada en los núcleos de los átomos. A partir del vapor, el camino se parece mucho.</p></div>", "cards": [{"q": "¿Qué elemento comparten casi todas las centrales eléctricas, con la excepción de las fotovoltaicas?", "opts": ["Un alternador que gira para producir electricidad", "Una caldera que quema combustible para dar vapor", "Una presa que almacena agua para mover turbinas", "Un reactor que libera calor mediante reacciones"], "correct": 0, "why": "La electricidad se produce haciendo girar un alternador; lo que cambia entre centrales es cómo se consigue ese giro. Caldera, presa y reactor son propios de algunos tipos, no de todos."}, {"q": "En una central de ciclo combinado, ¿qué ocurre con los gases de escape de la turbina de gas?", "opts": ["Se expulsan a la atmósfera tras mover la primera turbina", "Se vuelven a quemar en la cámara de la misma turbina", "Calientan una caldera cuyo vapor mueve una turbina de vapor", "Enfrían el condensador antes de salir por la chimenea"], "correct": 2, "why": "Esos gases salen a alta temperatura y aportan calor a una caldera o generador de vapor; el vapor mueve una segunda turbina. De ahí el nombre de ciclo combinado."}, {"q": "¿Qué diferencia fundamental separa una central nuclear de una central térmica de carbón?", "opts": ["La forma de convertir el giro en electricidad", "La fuente utilizada para generar el calor", "El uso de vapor para mover la turbina", "La necesidad de refrigerar el vapor de salida"], "correct": 1, "why": "Las dos calientan agua, producen vapor y giran una turbina unida a un alternador. Lo que cambia es la fuente de calor: combustión de carbón en una, fisión del uranio en la otra."}, {"q": "Una central usa espejos para concentrar la radiación solar y calentar agua. ¿En qué grupo de centrales encaja?", "opts": ["Fotovoltaica, porque transforma la luz del sol", "Hidroeléctrica, porque calienta agua de un embalse", "Ciclo combinado, porque suma dos fuentes de calor", "Térmica, porque produce vapor para la turbina"], "correct": 3, "why": "La fuente incluye entre las térmicas las que calientan agua con radiación solar concentrada por espejos: el vapor resultante mueve la turbina. La fotovoltaica no usa vapor ni alternador."}], "game": null}, {"id": "od2", "n": "02", "lvl": "comprender", "lvlLabel": "Comprender", "navTitle": "La fisión como fuente de calor", "titulo": "La fisión nuclear como fuente de calor", "objetivo": "<b>Describir</b> cómo la fisión del uranio produce el calor de una central, nombrando los tres resultados de cada fisión y el papel de las barras de control.", "contentHtml": "<p class='lead'>En el núcleo de los átomos se guarda una enorme cantidad de energía, y de ahí viene el nombre de energía nuclear. Para liberarla hay que romper, es decir, <b>fisionar</b>, ese núcleo. En la gran mayoría de las centrales el átomo elegido es el uranio.</p><p>La fisión se provoca haciendo chocar un neutrón, a la velocidad adecuada, contra el núcleo de un átomo de uranio. El impacto rompe el núcleo y deja tres resultados:</p><ul><li><b>Dos productos de fisión</b>: los núcleos de dos átomos más pequeños.</li><li><b>Dos o tres neutrones nuevos</b>, que salen despedidos y pueden romper otros núcleos de uranio. Es lo que se llama reacción en cadena.</li><li><b>Energía</b>, en gran parte en forma de calor. Ese calor es el que calienta el agua de la central.</li></ul><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Un neutrón choca con un núcleo de uranio, que se fisiona en dos productos de fisión, libera dos o tres neutrones y calor; una barra de control absorbe uno de los neutrones\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Un neutrón choca con un núcleo de uranio, que se fisiona en dos productos de fisión, libera dos o tres neutrones y calor; una barra de control absorbe uno de los neutrones</title><defs><radialGradient id=\"fis-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#132A42\"/><stop offset=\".6\" stop-color=\"#0B1622\"/><stop offset=\"1\" stop-color=\"#060D15\"/></radialGradient><pattern id=\"fis-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"><path d=\"M40 0H0V40\" fill=\"none\" stroke=\"#1E3346\" stroke-width=\"1\" opacity=\".55\"/></pattern><filter id=\"fis-glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"4\" result=\"b\"/><feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter><filter id=\"fis-soft\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"9\"/></filter><filter id=\"fis-blur\"><feGaussianBlur stdDeviation=\"6\"/></filter><marker id=\"fis-arw\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker><radialGradient id=\"fis-pr\" cx=\"35%\" cy=\"30%\" r=\"70%\"><stop offset=\"0\" stop-color=\"#FF8FA3\"/><stop offset=\".55\" stop-color=\"#D93A5B\"/><stop offset=\" t></svg><figcaption>Lee el dibujo de izquierda a derecha: un neutrón rompe el núcleo y salen dos productos de fisión, nuevos neutrones y calor. La barra de control de la derecha muestra cómo se retira un neutrón para que no provoque otra fisión.</figcaption></figure><p>¿De dónde sale esa energía? Si se suman las masas de los productos de fisión, el resultado es menor que la masa del núcleo antes de romperse. La masa que falta se ha convertido en energía, como indica la ecuación de Einstein, E = mc². Es el mismo defecto de masa que viste en el tema 1.1.</p><p>Una central necesita que la reacción en cadena se mantenga, pero también poder frenarla. De eso se encargan las <b>barras de control</b>, fabricadas con un material que absorbe neutrones. Colocadas entre las varillas de los elementos combustibles, cada neutrón que absorben es una fisión que no ocurre. Al introducirlas la reacción se frena; al extraerlas, se reactiva.</p><p>Las centrales PWR tienen además un segundo medio de control: <b>boro disuelto</b>, en forma de ácido bórico, en el agua del circuito primario. El boro también absorbe neutrones, pero repartido por todo el refrigerante, así que sirve para un ajuste fino y lento de la reacción. Su concentración se va modificando para compensar que el combustible se consume a lo largo del ciclo. Las barras quedan para los cambios rápidos y para parar el reactor.</p><div class=\"callout\" style=\"--c:var(--comprender);--c-tint:var(--comprender-tint)\"><span class=\"ic\">Del tema 1.1</span><p>Los neutrones que nacen en la fisión son rápidos, con una energía del orden de 1 MeV, mientras que el <sup>235</sup>U fisiona con más probabilidad con neutrones de unos 0,025 eV. Para frenarlos se usa un moderador. En las centrales PWR y BWR ese papel lo hace la misma agua que refrigera el reactor.</p></div><div class=\"callout\" style=\"--c:var(--analizar);--c-tint:var(--analizar-tint)\"><span class=\"ic\">Dato complementario</span><p>El libro no menciona el boro disuelto. La World Nuclear Association lo describe como el sistema de control secundario de las PWR (boro en el refrigerante), y la NRC estadounidense explica que el sistema de control químico y volumétrico ajusta la concentración de boro para compensar el quemado del núcleo y los cambios de reactividad por el xenón. En las BWR, que no usan boro disuelto en operación normal, el control secundario se hace variando el caudal de agua por el núcleo.</p></div>", "cards": [{"q": "Cuando un neutrón rompe un núcleo de uranio en una central, ¿qué se obtiene?", "opts": ["Un núcleo más pesado, un electrón y radiación gamma", "Dos productos de fisión, dos o tres neutrones y calor", "Dos núcleos de helio, un neutrón y energía química", "Un isótopo de uranio más estable y varios protones"], "correct": 1, "why": "La fisión rompe el núcleo en dos átomos más pequeños (productos de fisión), libera dos o tres neutrones capaces de continuar la cadena y desprende energía, sobre todo en forma de calor."}, {"q": "¿Por qué la fisión libera energía según la ecuación E = mc²?", "opts": ["Porque la masa de los productos es menor que la inicial", "Porque los productos pesan más que el núcleo inicial", "Porque el neutrón aporta la energía que después se libera", "Porque los electrones del átomo se separan del núcleo"], "correct": 0, "why": "La suma de las masas de los productos de fisión es menor que la masa del núcleo original. Esa diferencia de masa es la que se transforma en energía."}, {"q": "¿Cómo frenan las barras de control la reacción en cadena?", "opts": ["Enfrían el combustible hasta que deja de fisionar", "Aumentan la presión del agua que rodea la vasija", "Absorben neutrones y evitan que fisionen otros núcleos", "Aceleran los neutrones para que atraviesen el uranio"], "correct": 2, "why": "Están hechas de un material que absorbe neutrones. Cada neutrón absorbido ya no puede fisionar otro núcleo, así que la cadena se ralentiza."}, {"q": "En la fisión que tiene lugar en una central, ¿qué papel cumplen los dos o tres neutrones que se liberan?", "opts": ["Se convierten en los productos de fisión del proceso", "Transportan el calor desde el combustible hasta el agua", "Forman el vapor que después mueve la turbina", "Pueden fisionar otros núcleos y mantener la cadena"], "correct": 3, "why": "Al chocar con otros núcleos de uranio los fisionan, y estos liberan a su vez nuevos neutrones: es la reacción en cadena. El calor lo cede el combustible al agua, no los neutrones."}, {"q": "En una central PWR, ¿qué papel cumple el boro disuelto en el agua del primario?", "opts": ["Eleva la presión del primario para que el agua no hierva", "Absorbe neutrones y permite un ajuste fino de la reacción", "Protege las vainas del combustible frente a la corrosión", "Frena los neutrones rápidos para que fisionen el uranio"], "correct": 1, "why": "El boro absorbe neutrones igual que las barras de control, pero disuelto en todo el refrigerante; su concentración se ajusta poco a poco para compensar el consumo del combustible. Frenar neutrones es el papel del moderador, no del boro."}], "game": null}, {"id": "od3", "n": "03", "lvl": "analizar", "lvlLabel": "Analizar", "navTitle": "PWR frente a BWR", "titulo": "PWR y BWR: dos maneras de producir el vapor", "objetivo": "<b>Comparar</b> las centrales PWR y BWR según su número de circuitos, el lugar donde se forma el vapor y la entrada de las barras de control.", "contentHtml": "<p class='lead'>En el mundo hay muchos diseños de centrales nucleares, pero en España solo funcionan dos tipos: las de <b>agua a presión</b> (PWR, <i>Pressurized Water Reactor</i>) y las de <b>agua en ebullición</b> (BWR, <i>Boiling Water Reactor</i>). La diferencia está en dónde se forma el vapor.</p><h3>PWR: tres circuitos separados</h3><p><b>Circuito primario.</b> Contiene el reactor. El calor de la fisión calienta el agua a unos 300 ºC, pero esa agua no llega a hervir porque se mantiene a presión, que es lo que da nombre a este tipo de central. El componente que controla esa presión es el presionador. Es un circuito cerrado: unas bombas impulsan el agua, que sale caliente del reactor, se enfría al pasar por el generador de vapor y vuelve al reactor. Las barras de control se sitúan en la parte superior del reactor; al introducirlas, la reacción se frena.</p><p><b>Circuito secundario.</b> También cerrado. Su agua entra en el generador de vapor, se calienta y se evapora sin tocar en ningún momento el agua del primario. El vapor va a las turbinas, donde su energía térmica se convierte en giro; un eje transmite ese giro al alternador, que produce la electricidad. Después, el vapor se enfría y se condensa en el condensador, y el agua vuelve al generador de vapor.</p><p><b>Circuito terciario.</b> A diferencia de los otros dos, es abierto. Toma agua de una fuente (el mar, un río, un embalse), la bombea al condensador para enfriar el vapor que ya ha pasado por la turbina y la devuelve a la fuente, o a la atmósfera en forma de vapor si la central usa torres de refrigeración.</p><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Esquema de una central nuclear PWR con sus tres circuitos: primario cerrado con vasija, presionador, generador de vapor y bomba; secundario cerrado con turbina, alternador y condensador; terciario abierto con torre de refrigeración y toma de agua\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Esquema de una central nuclear PWR con sus tres circuitos: primario cerrado con vasija, presionador, generador de vapor y bomba; secundario cerrado con turbina, alternador y condensador; terciario abierto con torre de refrigeración y toma de agua</title><defs><radialGradient id=\"pwr-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#132A42\"/><stop offset=\".6\" stop-color=\"#0B1622\"/><stop offset=\"1\" stop-color=\"#060D15\"/></radialGradient><pattern id=\"pwr-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse ciones de trabajo de cada diseño: en una PWR el agua del núcleo alcanza unos 325 ºC y se mantiene a unas 150 veces la presión atmosférica para que no hierva; en una BWR el circuito trabaja a unas 75 atmósferas y el agua hierve en el núcleo a unos 285 ºC. En su recuento de agosto de 2026, 316 de los reactores operables del mundo eran PWR y 60 eran BWR.</p></div>", "cards": [{"q": "Un técnico analiza el agua que mueve la turbina de una PWR. ¿Por qué esa agua no ha pasado por el reactor?", "opts": ["Porque el condensador filtra el agua antes de llegar al reactor", "Porque el presionador separa el vapor del agua del primario", "Porque el terciario sustituye esa agua en cada vuelta al río", "Porque el secundario se calienta en el generador sin mezclarse"], "correct": 3, "why": "En una PWR el agua del secundario se evapora en el generador de vapor sin entrar en contacto con la del primario. Solo el secundario pasa por la turbina."}, {"q": "¿Qué componente forma parte de una PWR y NO es necesario en una BWR?", "opts": ["El condensador del vapor", "El generador de vapor", "La turbina de baja presión", "El alternador de la central"], "correct": 1, "why": "En la BWR el vapor se genera directamente en la vasija del reactor, así que no hace falta un generador de vapor. Condensador, turbinas y alternador están en los dos diseños."}, {"q": "¿Por qué el agua del primario de una PWR no hierve, aunque alcance unos 300 ºC?", "opts": ["Porque se mantiene a presión gracias al presionador", "Porque el moderador absorbe el calor antes de hervir", "Porque las barras de control limitan su temperatura", "Porque el terciario la enfría dentro de la vasija"], "correct": 0, "why": "El agua sigue líquida porque está sometida a presión, y el presionador es el componente que la controla. De ahí el nombre de reactor de agua a presión."}, {"q": "En una BWR, ¿por dónde se insertan las barras de control en los elementos combustibles?", "opts": ["Por la parte superior de la vasija", "Por el generador de vapor del reactor", "Por la parte inferior de la vasija", "Por los lazos del circuito primario"], "correct": 2, "why": "Es una de las diferencias entre ambos diseños: en la BWR las barras entran por abajo y en la PWR por arriba. La BWR, además, no tiene generador de vapor."}], "game": null}, {"id": "od4", "n": "04", "lvl": "analizar", "lvlLabel": "Analizar", "navTitle": "Componentes principales", "titulo": "Sistemas y componentes principales", "objetivo": "<b>Relacionar</b> cada componente principal de una central PWR con su función y con el circuito al que pertenece.", "contentHtml": "<p class='lead'>Una central PWR suele organizarse en varios lazos: cada lazo une la vasija con un generador de vapor y una bomba. Estos son sus componentes principales, del reactor a la torre de refrigeración.</p><figure><img src='infografia_central_pwr.jpg' width='2240' height='2800' loading='lazy' alt='Infografía de una central nuclear PWR en corte: edificio de contención con vasija, núcleo, presionador, generadores de vapor, bombas y tuberías del primario; sala de turbinas con turbina, generador y condensador; circuito de refrigeración, sala de control y piscina de combustible gastado, con recuadros sobre combustible, circuitos, secuencia de operación, control de reactividad, defensa en profundidad y sistemas de seguridad.'><figcaption>Localiza dentro de la contención la vasija, el presionador, los generadores de vapor y las bombas, y sigue las tuberías hasta la turbina y el condensador. Los recuadros 4 a 6 adelantan M3 y M4.</figcaption></figure><p><b>La vasija del reactor</b> es el corazón de la central. Dentro están los elementos combustibles, donde se producen las fisiones. Sus paredes, junto con el resto del circuito primario, forman una barrera frente a las partículas radiactivas de las reacciones nucleares. Cada elemento combustible reúne muchas varillas llenas de pastillas de dióxido de uranio, y el agua de refrigeración sube a través de ellos para llevarse el calor. Entre las varillas se alojan las barras de control, hechas de un material que absorbe neutrones.</p><p><b>El presionador</b>, que solo existe en las PWR, mantiene constante la presión del circuito primario. En su parte inferior tiene unas resistencias que calientan el contenido, y en la superior, unas duchas que lo enfrían. Calentar sube la presión del presionador y, con ella, la de todo el primario; enfriar la baja.</p><p><b>Los generadores de vapor</b> son la frontera entre el primario y el secundario, y por eso se consideran parte de los dos. Funcionan como intercambiadores de calor: el agua del primario, que llega directamente del reactor, circula por el interior de un haz de tubos; el agua del secundario toca esos tubos por fuera, se calienta y se evapora. Arriba del todo, unos separadores de humedad evitan que el vapor arrastre gotas que podrían dañar las turbinas.</p><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Anatomía del presionador, con resistencias abajo y duchas arriba, y del generador de vapor, con el haz de tubos en U por el que circula el primario y los separadores de humedad en la parte superior\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Anatomía del presionador, con resistencias abajo y duchas arriba, y del generador de vapor, con el haz de tubos en U por el que circula el primario y los separadores de humedad en la parte superior</title><defs><radialGradient id=\"cmp-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#132A42\"/><stop offset=\".6\" stop-color=\"#0B1622\"/><stop offset=\"1\" stop-color=\"#060D15\"/></radialGradient><pattern id=\"cmp-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"><path d=\"M40 0H0V40\" fill=\"none\" stroke=\"#1E3346\" stroke-width=\"1\" opacity=\".55\"/></pattern><filter id=\"cmp-glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"4\" result=\"b\"/><feMerge><f "/><circle cx=\"1220\" cy=\"390\" r=\"6\" fill=\"#3EC9E8\" filter=\"url(#cmp-glow)\"/><rect x=\"830\" y=\"620\" width=\"230\" height=\"96\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#FF4D8D\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M830 632V620H842 M1048 620H1060V632 M1060 704V716H1048 M842 716H830V704\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"3\" filter=\"url(#cmp-glow)\"/><text x=\"846\" y=\"650\" font-size=\"18\" font-weight=\"700\" fill=\"#FF4D8D\" font-family=\"Space Mono, Consolas, Menlo, monospace\" letter-spacing=\".5\">ENTRA Y SALE</text><text x=\"846\" y=\"676.1\" font-size=\"18\" fill=\"#E6EDF5\"><tspan x=\"846\" dy=\"0em\">el primario por la</tspan><tspan x=\"846\" dy=\"1.35em\">parte inferior</tspan></text><path d=\"M1060 690L1120 755\" stroke=\"#0B1622\" stroke-opacity=\".8\" stroke-width=\"7\"/><path d=\"M1060 690L1120 755\" stroke=\"#FF4D8D\" stroke-width=\"2.5\"/><circle cx=\"1120\" cy=\"755\" r=\"8\" fill=\"#0B1622\"/><circle cx=\"1120\" cy=\"755\" r=\"6\" fill=\"#FF4D8D\" filter=\"url(#cmp-glow)\"/><rect x=\"1300\" y=\"600\" width=\"260\" height=\"96\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#3EC9E8\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M1300 612V600H1312 M1548 600H1560V612 M1560 684V696H1548 M1312 696H1300V684\" fill=\"none\" stroke=\"#3EC9E8\" stroke-width=\"3\" filter=\"url(#cmp-glow)\"/><text x=\"1316\" y=\"630\" font-size=\"18\" font-weight=\"700\" fill=\"#3EC9E8\" font-family=\"Space Mono, Consolas, Menlo, monospace\" letter-spacing=\".5\">AGUA DE</text><text x=\"1316\" y=\"656.1\" font-size=\"18\" fill=\"#E6EDF5\"><tspan x=\"1316\" dy=\"0em\">ALIMENTACIÓN: llega</tspan><tspan x=\"1316\" dy=\"1.35em\">del condensador</tspan></text><path d=\"M1400 600L1350 560\" stroke=\"#0B1622\" stroke-opacity=\".8\" stroke-width=\"7\"/><path d=\"M1400 600L1350 560\" stroke=\"#3EC9E8\" stroke-width=\"2.5\"/><circle cx=\"1350\" cy=\"560\" r=\"8\" fill=\"#0B1622\"/><circle cx=\"1350\" cy=\"560\" r=\"6\" fill=\"#3EC9E8\" filter=\"url(#cmp-glow)\"/></svg><figcaption>A la izquierda, cómo regula el presionador la presión con dos mecanismos opuestos. A la derecha, por qué el primario y el secundario intercambian calor sin mezclarse: uno va por dentro de los tubos y el otro por fuera.</figcaption></figure><p><b>Las bombas de refrigerante del reactor</b> son equipos de gran potencia y tamaño que llevan el agua del primario desde los generadores de vapor de vuelta a la vasija.</p><p><b>Las turbinas</b> reciben el vapor y convierten su energía térmica en energía mecánica. Tienen dos cuerpos: uno de alta presión y otro de baja. El vapor que sale de la turbina de alta pasa por los <b>recalentadores</b>, donde se calienta de nuevo y se le quita humedad, para mejorar el rendimiento de la planta y evitar daños en las turbinas de baja presión.</p><p><b>El alternador</b> está unido a la turbina por un eje que le transmite el giro, y convierte esa energía mecánica en eléctrica, que sale por líneas de alta tensión hacia la red.</p><p><b>El condensador</b> recibe el vapor de baja energía que sale de las turbinas de baja presión y lo enfría hasta convertirlo de nuevo en agua, gracias al agua fría del terciario. Esa agua condensada se calienta previamente y vuelve, bombeada, a los generadores de vapor.</p><p><b>Las torres de refrigeración</b> pertenecen al circuito terciario, que es abierto. Para no alterar el ecosistema con un cambio brusco de temperatura, se vigila con precisión la temperatura del agua que vuelve a la fuente. Por esas enormes estructuras hiperbólicas solo sale vapor de agua; la fuente las describe como fábricas de nubes.</p><div class=\"tbl-wrap\"><table><thead><tr><th>Componente</th><th>Circuito</th><th>Función</th></tr></thead><tbody><tr><td>Vasija del reactor</td><td>Primario</td><td>Aloja el combustible donde se producen las fisiones</td></tr><tr><td>Barras de control</td><td>Primario</td><td>Absorben neutrones para regular o frenar la reacción</td></tr><tr><td>Boro disuelto</td><td>Primario (solo PWR)</td><td>Absorbe neutrones repartido en el agua: ajuste fino de la reacción</td></tr><tr><td>Presionador</td><td>Primario (solo PWR)</td><td>Mantiene constante la presión con resistencias y duchas</td></tr><tr><td>Bombas de refrigerante</td><td>Primario</td><td>Devuelven el agua del generador de vapor a la vasija</td></tr><tr><td>Generador de vapor</td><td>Frontera primario-secundario</td><td>Pasa el calor del primario al secundario, que se evapora</td></tr><tr><td>Turbinas (alta y baja presión)</td><td>Secundario</td><td>Convierten la energía térmica del vapor en giro</td></tr><tr><td>Recalentadores</td><td>Secundario</td><td>Recalientan y secan el vapor entre la turbina de alta y la de baja</td></tr><tr><td>Alternador</td><td>Secundario (unido por eje)</td><td>Convierte el giro en electricidad</td></tr><tr><td>Condensador</td><td>Frontera secundario-terciario</td><td>Enfría el vapor y lo devuelve como agua</td></tr><tr><td>Torres de refrigeración</td><td>Terciario</td><td>Refrigeran el agua de circulación; solo emiten vapor de agua</td></tr></tbody></table></div>", "cards": [{"q": "Durante la operación, la presión del primario de una PWR empieza a bajar. ¿Qué actuación del presionador la corrige?", "opts": ["Activar las duchas superiores para enfriar su contenido", "Encender las resistencias inferiores para calentar el agua", "Abrir los separadores de humedad para liberar el vapor", "Arrancar las bombas del terciario para enfriar el condensador"], "correct": 1, "why": "Las resistencias de la parte inferior calientan el contenido del presionador y hacen subir su presión, y con ella la del primario. Las duchas producen el efecto contrario."}, {"q": "¿Qué función cumplen los separadores de humedad situados en la parte alta del generador de vapor?", "opts": ["Evitar que el vapor arrastre humedad que dañe las turbinas", "Separar el agua del primario del agua del secundario", "Retirar la humedad del aire que entra en la contención", "Recoger el vapor que sale de las turbinas de baja presión"], "correct": 0, "why": "Están en la parte superior del generador de vapor e impiden que el vapor lleve gotas de agua hasta las turbinas, donde podrían causar daños."}, {"q": "¿Para qué pasa por los recalentadores el vapor que sale de la turbina de alta presión?", "opts": ["Para condensarlo y devolverlo al generador de vapor", "Para aumentar su presión antes de entrar al alternador", "Para calentarlo de nuevo, secarlo y mejorar el rendimiento", "Para enfriarlo con el agua que llega del terciario"], "correct": 2, "why": "En los recalentadores el vapor se calienta y se deshumidifica. Así mejora el rendimiento termodinámico de la planta y se evitan daños estructurales en las turbinas de baja presión."}, {"q": "En el condensador de una central PWR, ¿qué dos circuitos intercambian calor?", "opts": ["El primario y el secundario", "El primario y el terciario", "El terciario y la red eléctrica", "El secundario y el terciario"], "correct": 3, "why": "El vapor del secundario, tras pasar por las turbinas, se enfría y condensa gracias al agua fría del terciario. Primario y secundario intercambian calor en el generador de vapor, no aquí."}], "game": null}, {"id": "od5", "n": "05", "lvl": "analizar", "lvlLabel": "Analizar", "navTitle": "Centrales nucleares en el mundo", "titulo": "Las centrales nucleares en el mundo y en España", "objetivo": "<b>Analizar</b> cómo se reparten las centrales nucleares en el mundo, comparando por países el número de reactores y su peso en la electricidad, y situar en ese mapa la evolución del parque español desde 2013.", "contentHtml": "<p class='lead'>A mediados de septiembre de 2026, la World Nuclear Association contaba <b>441 reactores operables</b> en 31 países, con 404.127 MWe de potencia neta. En 2025 produjeron alrededor del <b>9 % de la electricidad mundial</b>, y hay otros 80 reactores en construcción.</p><p>El reparto es muy desigual. Cinco países (Estados Unidos, China, Francia, Rusia y Japón) suman 282 reactores, casi dos de cada tres. Pero tener muchos reactores no significa que la nuclear pese mucho en la electricidad del país. Estados Unidos, con 94, obtiene de ellos el 17,7 % de su electricidad; Francia, con 57, el 68,1 %. Lo que cuenta es la relación entre el parque nuclear y el tamaño de todo el sistema eléctrico.</p><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Mapa del mundo con los países que tienen reactores nucleares operables, con círculos proporcionales al número de reactores, y ampliación de Europa\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Mapa del mundo con los países que tienen reactores nucleares operables, con círculos proporcionales al número de reactores, y ampliación de Europa</title><defs><radialGradient id=\"mun-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#132A42\"/><stop offset=\".6\" stop-color=\"#0B1622\"/><stop offset=\"1\" stop-color=\"#060D15\"/></radialGradient><pattern id=\"mun-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"><path d=\"M40 0H0V40\" fill=\"none\" stroke=\"#1E3346\" stroke-width=\"1\" opacity=\".55\"/></pattern><filter id=\"mun-glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"4\" result=\"b\"/><feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter><filter id=\"mun-soft\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"9\"/></filter><filter id=\"mun-blur\"><feGaussianBlur stdDeviation=\"6\"/></filter><marker id=\"mun-arw\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"context-stroke\"/></marker></defs><rect width=\"1600\" height=\"900\" fill=\"#0B1622\"/><rect width=\"1600\" height=\"900\" fill=\"url(#mun-bg)\"/><rect width=\"1600\" height=\"90 uota eléctrica y cifras de 2025.</text></svg><figcaption>El tamaño de cada círculo indica cuántos reactores operables tiene el país. En la ampliación de la derecha se aprecia la densidad del parque europeo; en ámbar, los países que construyen sus primeras centrales.</figcaption></figure><div class=\"tbl-wrap\"><table><thead><tr><th>País</th><th>Reactores operables</th><th>Potencia neta (MWe)</th><th>Cuota nuclear de su electricidad (2025)</th><th>En construcción</th></tr></thead><tbody><tr><td>Estados Unidos</td><td>94</td><td>96.952</td><td>17,7 %</td><td>0</td></tr><tr><td>China</td><td>64</td><td>63.985</td><td>5,0 %</td><td>38</td></tr><tr><td>Francia</td><td>57</td><td>63.000</td><td>68,1 %</td><td>0</td></tr><tr><td>Rusia</td><td>34</td><td>27.969</td><td>18,7 %</td><td>7</td></tr><tr><td>Japón</td><td>33</td><td>31.679</td><td>9,4 %</td><td>2</td></tr><tr><td>Corea del Sur</td><td>26</td><td>25.609</td><td>31,0 %</td><td>4</td></tr><tr><td>India</td><td>24</td><td>7.935</td><td>3,2 %</td><td>8</td></tr><tr><td>Canadá</td><td>17</td><td>12.714</td><td>13,0 %</td><td>1</td></tr><tr><td>Ucrania</td><td>15</td><td>13.107</td><td>52,0 %</td><td>2</td></tr><tr><td>España</td><td>7</td><td>7.123</td><td>18,9 %</td><td>0</td></tr></tbody></table></div><p>La construcción se concentra hoy en Asia: China tiene 38 de los 80 reactores en obra, seguida de India (8) y Rusia (7). Bangladés, Egipto y Turquía levantan sus primeras centrales. Por tipos, el PWR domina con claridad: en el recuento de agosto de 2026, 316 de los reactores operables eran de agua a presión y 60 de agua en ebullición.</p><h3>España dentro de ese mapa</h3><p>El libro de referencia se editó en 2013 y retrata el parque español de ese momento: ocho reactores (Almaraz I y II, Ascó I y II, Cofrentes, Santa María de Garoña, Trillo I y Vandellós II), más de 7.700 MW y cerca del 20 % de las necesidades del país. José Cabrera (Zorita) y Vandellós I estaban en desmantelamiento, y Garoña tenía todo su combustible descargado, a la espera de posibles cambios normativos. Completaban el sistema la fábrica de combustible de Juzbado (Salamanca) y el almacén de residuos de baja y media actividad de El Cabril (Córdoba).</p><p>Hoy operan <b>siete reactores</b>, seis PWR y un BWR (Cofrentes). Garoña no volvió a funcionar: en 2017 el Gobierno rechazó renovar su autorización y la central está en pre-desmantelamiento. En 2025, según Foro Nuclear, el parque generó 51.836 GWh netos, el <b>19,06 %</b> de la electricidad del país, con solo el 5,28 % de la potencia instalada, porque estuvo a plena potencia una media de 7.283 horas, el 83,14 % del año.</p><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Gráfico de barras con la potencia de los siete reactores en operación en España según Foro Nuclear, y comparación entre los datos del libro de 2013 y los de 2025\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Gráfico de barras con la potencia de los siete reactores en operación en España según Foro Nuclear, y comparación entre los datos del libro de 2013 y los de 2025</title><defs><radialGradient id=\"esp-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#132A42\"/><stop offset=\".6\" stop-color=\"#0B1622\"/><stop offset=\"1\" stop-color=\"#060D15\"/></radialGradient><pattern id=\"esp-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"><path d=\"M40 0H0V40\" fill=\"none\" stroke=\"#1E3346\" stroke-width=\"1\" opacity=\".55\"/></pattern><filter id=\"esp-glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"4\" result=\"b\"/><feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter><filter id=\"esp-soft\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"9\"/></filter><filter id=\"esp-blur\"><feGaussianBlur stdDeviation=\"6\"/></filter><marker id=\"esp-arw\" viewBox=\"0 0 10 10\" refX=\" ily=\"Space Mono, Consolas, Menlo, monospace\" letter-spacing=\".5\">HOY (FORO NUCLEAR, 2025)</text><text x=\"996\" y=\"396.1\" font-size=\"18\" fill=\"#E6EDF5\"><tspan x=\"996\" dy=\"0em\">7 reactores en operación</tspan><tspan x=\"996\" dy=\"1.35em\">51.836 GWh netos generados</tspan><tspan x=\"996\" dy=\"1.35em\">19,06 % de la electricidad producida</tspan></text><rect x=\"980\" y=\"530\" width=\"580\" height=\"260\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#FF4D8D\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M980 542V530H992 M1548 530H1560V542 M1560 778V790H1548 M992 790H980V778\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"3\" filter=\"url(#esp-glow)\"/><text x=\"996\" y=\"560\" font-size=\"20\" font-weight=\"700\" fill=\"#FF4D8D\" font-family=\"Space Mono, Consolas, Menlo, monospace\" letter-spacing=\".5\">YA NO PRODUCEN</text><text x=\"996\" y=\"586.1\" font-size=\"18\" fill=\"#E6EDF5\"><tspan x=\"996\" dy=\"0em\">Vandellós I · parada en 1989</tspan><tspan x=\"996\" dy=\"1.35em\">José Cabrera (Zorita) · parada en 2006</tspan><tspan x=\"996\" dy=\"1.35em\">Santa María de Garoña · renovación</tspan><tspan x=\"996\" dy=\"1.35em\">   de licencia denegada en 2017</tspan><tspan x=\"996\" dy=\"1.35em\">Otras instalaciones: fábrica de</tspan><tspan x=\"996\" dy=\"1.35em\">   combustible de Juzbado y El Cabril</tspan></text></svg><figcaption>Las barras comparan la potencia de cada reactor y su color indica el tipo: seis PWR y un BWR. A la derecha, la misma realidad vista en 2013 y en 2025.</figcaption></figure><div class=\"callout\" style=\"--c:var(--analizar);--c-tint:var(--analizar-tint)\"><span class=\"ic\">Lectura crítica</span><p>Una cifra sin fecha ni fuente puede engañar. El libro habla de ocho reactores y del 20 % porque describe 2013. Y dos fuentes serias pueden dar valores algo distintos para el mismo año: la World Nuclear Association atribuye a España un 18,9 % de electricidad nuclear en 2025 y Foro Nuclear un 19,06 %. Cita siempre de dónde sale el dato y a qué fecha se refiere. El calendario de cierre tampoco es fijo: en octubre de 2025, Foro Nuclear recogía que prevé el cese de los dos reactores de Almaraz en 2027 y 2028.</p></div>", "cards": [{"q": "Francia tiene 57 reactores y Estados Unidos 94, pero la cuota nuclear francesa (68 %) casi cuadruplica la de EE. UU. (18 %). ¿Qué lo explica?", "opts": ["Los reactores franceses son BWR y tienen más potencia", "El sistema eléctrico estadounidense es mucho mayor que el francés", "La mayoría de reactores estadounidenses está parada por revisión", "Francia suma a su parque la electricidad nuclear importada"], "correct": 1, "why": "La cuota depende de cuánta electricidad nuclear se produce frente al total del país. Estados Unidos tiene más reactores, pero su sistema eléctrico es mucho más grande, así que la nuclear pesa menos en porcentaje. Los reactores franceses son PWR."}, {"q": "¿Qué país concentra la mayor parte de los reactores que se están construyendo hoy en el mundo?", "opts": ["China, con 38 de los 80 reactores en obra", "India, con más de la mitad de los reactores en obra", "Estados Unidos, que amplía su parque de 94 reactores", "Francia, que sustituye poco a poco sus 57 reactores"], "correct": 0, "why": "Según la World Nuclear Association (septiembre de 2026), China tiene 38 de los 80 reactores en construcción. India le sigue con 8; Estados Unidos y Francia no tienen ninguno en obra en esa fecha."}, {"q": "Al comparar el libro (2013) con los datos de Foro Nuclear, ¿qué explica que el parque español haya pasado de 8 a 7 reactores?", "opts": ["La conversión de Cofrentes de tipo BWR a tipo PWR", "El desmantelamiento de Vandellós II tras su parada en 1989", "El cierre de Santa María de Garoña tras denegarse su licencia", "La fusión de Almaraz I y Almaraz II en una sola unidad"], "correct": 2, "why": "En 2017 se rechazó renovar la autorización de explotación de Garoña, que ya no operaba en 2013. La que paró en 1989 fue Vandellós I, no Vandellós II, que sigue en operación."}, {"q": "En 2025 la nuclear aportó el 19,06 % de la electricidad española con solo el 5,28 % de la potencia instalada. ¿Qué dato del mismo informe ayuda a explicarlo?", "opts": ["Sus reactores superan los 1.000 MWe de potencia", "Cubrió más de una cuarta parte de la electricidad limpia", "Su combustible se fabrica en la planta de Juzbado", "Funcionó a plena potencia unas 7.283 horas del año"], "correct": 3, "why": "Producir mucha energía con poca potencia instalada exige funcionar muchas horas: el parque estuvo a plena potencia el 83,14 % de las horas del año. Los demás datos son ciertos, pero no explican esa diferencia."}], "game": null}, {"id": "od6", "n": "06", "lvl": "aplicar", "lvlLabel": "Aplicar", "navTitle": "Del núcleo a la red", "titulo": "Del núcleo a la red: seguir el recorrido de la energía", "objetivo": "<b>Aplicar</b> la cadena de transformaciones de la energía (nuclear, térmica, mecánica y eléctrica) para decidir qué componente interviene ante una situación concreta de una central PWR o BWR.", "contentHtml": "<p class='lead'>Todo lo visto en esta unidad se resume en una cadena. Los neutrones rompen núcleos de uranio y se libera calor; ese calor calienta agua y produce vapor; el vapor mueve la turbina, que convierte la energía térmica en mecánica; y el alternador transforma ese giro en electricidad.</p><figure><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Cadena de transformaciones de la energía en una central nuclear: nuclear, térmica, mecánica y eléctrica, con el componente donde ocurre cada paso en una central PWR y en una BWR\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Space Grotesk, Segoe UI, Inter, Arial, sans-serif\"><title>Cadena de transformaciones de la energía en una central nuclear: nuclear, térmica, mecánica y eléctrica, con el componente donde ocurre cada paso en una central PWR y en una BWR</title><defs><radialGradient id=\"cad-bg\" cx=\"50%\" cy=\"45%\" r=\"75%\"><stop offset=\" ath d=\"M125 672V660H137 M403 660H415V672 M415 758V770H403 M137 770H125V758\" fill=\"none\" stroke=\"#FFC24B\" stroke-width=\"3\" filter=\"url(#cad-glow)\"/><text x=\"143\" y=\"704\" font-size=\"19\" fill=\"#E6EDF5\"><tspan x=\"143\" dy=\"0em\">Vasija: fisión en el</tspan><tspan x=\"143\" dy=\"1.35em\">combustible</tspan></text><rect x=\"485\" y=\"660\" width=\"290\" height=\"110\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#FFC24B\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M485 672V660H497 M763 660H775V672 M775 758V770H763 M497 770H485V758\" fill=\"none\" stroke=\"#FFC24B\" stroke-width=\"3\" filter=\"url(#cad-glow)\"/><text x=\"503\" y=\"704\" font-size=\"19\" fill=\"#E6EDF5\"><tspan x=\"503\" dy=\"0em\">Vasija: el agua hierve</tspan><tspan x=\"503\" dy=\"1.35em\">y sale como vapor</tspan></text><rect x=\"845\" y=\"660\" width=\"290\" height=\"110\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#FFC24B\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M845 672V660H857 M1123 660H1135V672 M1135 758V770H1123 M857 770H845V758\" fill=\"none\" stroke=\"#FFC24B\" stroke-width=\"3\" filter=\"url(#cad-glow)\"/><text x=\"863\" y=\"704\" font-size=\"19\" fill=\"#E6EDF5\"><tspan x=\"863\" dy=\"0em\">Turbinas de alta y</tspan><tspan x=\"863\" dy=\"1.35em\">baja presión</tspan></text><rect x=\"1205\" y=\"660\" width=\"290\" height=\"110\" rx=\"6\" fill=\"#0B1622\" fill-opacity=\"0.88\" stroke=\"#FFC24B\" stroke-opacity=\".75\" stroke-width=\"1.2\"/><path d=\"M1205 672V660H1217 M1483 660H1495V672 M1495 758V770H1483 M1217 770H1205V758\" fill=\"none\" stroke=\"#FFC24B\" stroke-width=\"3\" filter=\"url(#cad-glow)\"/><text x=\"1223\" y=\"704\" font-size=\"19\" fill=\"#E6EDF5\"><tspan x=\"1223\" dy=\"0em\">Alternador: el eje</tspan><tspan x=\"1223\" dy=\"1.35em\">transmite el giro</tspan></text></svg><figcaption>La cadena de arriba es la misma en los dos diseños. Las filas de abajo muestran dónde ocurre cada paso: la única casilla que cambia es la de la energía térmica, porque en la PWR interviene el generador de vapor y en la BWR el agua hierve en la vasija.</figcaption></figure><p>Esta cadena sirve para razonar ante una situación concreta de la central. Antes de decidir qué componente actúa, conviene hacerse tres preguntas:</p><ol><li><b>¿En qué forma está la energía en ese punto?</b> Nuclear, térmica, mecánica o eléctrica.</li><li><b>¿En qué circuito ocurre?</b> Primario, secundario o terciario, en una PWR; en una BWR solo hay dos.</li><li><b>¿Qué componente de ese circuito tiene esa función?</b> Por ejemplo, la presión del primario la regula el presionador, y la reacción en cadena, las barras de control.</li></ol><div class=\"callout\" style=\"--c:var(--aplicar);--c-tint:var(--aplicar-tint)\"><span class=\"ic\">Serious game</span><p>En el simulador de abajo acompañas a Elena García, jefa de turno de la Central Átomo Verde, una PWR ficticia. En cada situación elige la actuación que mejor encaja con la función de cada componente. Superas el turno con 6 puntos de 8.</p></div>", "cards": [{"q": "En una PWR, ¿en qué componente la energía térmica del vapor se transforma en energía mecánica?", "opts": ["En las turbinas de alta y baja presión", "En el generador de vapor del secundario", "En el alternador unido al eje", "En el condensador del circuito secundario"], "correct": 0, "why": "Las turbinas convierten la energía térmica del vapor en giro, es decir, en energía mecánica. El alternador transforma después ese giro en electricidad."}, {"q": "Si en una BWR se corta el paso de vapor, ¿qué transformación de energía se interrumpe primero?", "opts": ["De nuclear a térmica, en la vasija", "De mecánica a eléctrica, en el alternador", "De eléctrica a térmica, en el condensador", "De térmica a mecánica, en la turbina"], "correct": 3, "why": "El vapor es lo que mueve la turbina, que convierte energía térmica en mecánica; sin vapor, esa transformación se detiene y, tras ella, la del alternador."}, {"q": "Un alumno explica una PWR así: «la vasija hace hervir el agua y el vapor va a la turbina». ¿Qué error comete?", "opts": ["Olvida que el vapor pasa antes por el presionador", "Confunde la turbina con el alternador de la central", "Describe una BWR: en la PWR el vapor sale del generador", "Omite que el terciario calienta el agua del primario"], "correct": 2, "why": "En la PWR el agua de la vasija no hierve, porque está a presión; el vapor se forma en el generador de vapor, en el secundario. Hervir en la vasija es lo propio de una BWR."}], "game": {"titulo": "Turno de sala de control en la Central Átomo Verde", "intro": "Acompañas a Elena García, jefa de turno de la Central Átomo Verde, una central PWR ficticia. Durante el turno van llegando avisos. En cada uno, elige la actuación que corresponde a la función de cada componente.", "threshold": 6, "scenarios": [{"title": "Sube la presión del primario", "situation": "El indicador de la sala de control muestra que la presión del circuito primario está subiendo por encima de su valor normal.", "options": [{"label": "Encender las resistencias del presionador para calentar el agua", "score": 0, "fb": "Al calentar el contenido del presionador la presión sube todavía más. Las resistencias se usan cuando la presión baja."}, {"label": "Actuar sobre las duchas del presionador para enfriar su contenido", "score": 2, "fb": "Correcto. Las duchas de la parte superior enfrían el presionador; su presión baja y, con ella, la de todo el circuito primario."}, {"label": "Insertar las barras de control para reducir la potencia del reactor", "score": 1, "fb": "Frenar la reacción reduce el calor que se produce, pero el componente encargado de mantener la presión del primario es el presionador."}, {"label": "Aumentar el caudal del terciario para enfriar más el condensador", "score": 0, "fb": "El terciario refrigera el condensador del secundario. No toca el primario, que es un circuito cerrado."}]}, {"title": "Orden de bajar potencia", "situation": "El centro de control de la red pide reducir la potencia del reactor durante unas horas.", "options": [{"label": "Extraer parte de las barras de control del núcleo del reactor", "score": 0, "fb": "Al extraerlas absorben menos neutrones, hay más fisiones y la potencia sube en lugar de bajar."}, {"label": "Parar las bombas de refrigerante para que circule menos agua", "score": 0, "fb": "Las bombas llevan el agua del primario a la vasija para extraer el calor; no regulan la reacción en cadena."}, {"label": "Bajar la presión del primario con las duchas del presionador", "score": 0, "fb": "El presionador controla la presión del primario, no el número de fisiones."}, {"label": "Introducir más las barras de control en los elementos combustibles", "score": 2, "fb": "Correcto. Las barras absorben neutrones; con más barras dentro hay menos fisiones y la reacción en cadena se frena."}]}, {"title": "Vapor húmedo tras la turbina de alta", "situation": "Nico Salas, técnico en prácticas, observa que el vapor que sale de la turbina de alta presión lleva humedad y pregunta qué ocurre con él.", "options": [{"label": "Revisar los separadores de humedad del generador de vapor", "score": 1, "fb": "Buena intuición: evitan que el vapor salga húmedo del generador. Pero el vapor que ya ha pasado por la turbina de alta se trata en los recalentadores."}, {"label": "Comprobar que pasa por los recalentadores antes de la baja presión", "score": 2, "fb": "Correcto. En los recalentadores el vapor se calienta de nuevo y se seca, lo que mejora el rendimiento y protege las turbinas de baja presión."}, {"label": "Enviarlo directamente al condensador sin pasar por la turbina de baja", "score": 0, "fb": "Así se desaprovecha la energía que aún tiene el vapor. El ciclo prevé recalentarlo y secarlo antes de la turbina de baja presión."}, {"label": "Llevarlo al presionador para que recupere la presión perdida", "score": 0, "fb": "El presionador pertenece al primario, y el vapor de la turbina está en el secundario. Los dos circuitos no se mezclan."}]}, {"title": "El agua vuelve caliente al río", "situation": "Ramón Vidal, del área de medio ambiente, avisa de que el agua que vuelve al río sale más caliente de lo habitual.", "options": [{"label": "Pedir que el agua del primario se enfríe con agua del río", "score": 0, "fb": "El primario es un circuito cerrado y no entra en contacto con el agua del río; el calor se cede en el generador de vapor y en el condensador."}, {"label": "Revisar el condensador, donde el terciario recoge el calor del vapor", "score": 1, "fb": "Bien localizado: es ahí donde se calienta el agua del terciario. Pero la medida que describe la fuente es vigilar la temperatura de retorno y refrigerar con las torres."}, {"label": "Vigilar la temperatura de retorno y usar las torres de refrigeración", "score": 2, "fb": "Correcto. La temperatura del agua de retorno se vigila con precisión para no alterar el ecosistema, y las torres refrigeran el agua de circulación emitiendo solo vapor."}, {"label": "Reducir el caudal de agua que la central toma del río", "score": 0, "fb": "Con menos agua para retirar el mismo calor, el agua que vuelve al río saldría todavía más caliente."}]}]}}]};
