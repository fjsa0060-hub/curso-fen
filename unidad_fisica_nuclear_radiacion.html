\"2\" marker-end=\"url(#arwB)\"/><line x1=\"1190\" y1=\"450\" x2=\"1400\" y2=\"450\" stroke=\"#8FD14F\" stroke-width=\"2\" marker-end=\"url(#arwB)\" stroke-dasharray=\"2 6\"/><text x=\"1184\" y=\"364\" font-size=\"13\" fill=\"#8FD14F\">2 n</text><text x=\"704\" y=\"608\" font-size=\"16\" fill=\"#FFC24B\" font-weight=\"700\">(c)</text><circle cx=\"760\" cy=\"648\" r=\"26\" fill=\"#16233A\" stroke=\"#FFC24B\" stroke-width=\"3\"/><text x=\"760\" y=\"654\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\">²³⁵U</text><path d=\"M 900.0 630.0 L 904.4 641.9 L 917.1 642.4 L 907.2 650.3 L 910.6 662.6 L 900.0 655.6 L 889.4 662.6 L 892.8 650.3 L 882.9 642.4 L 895.6 641.9 Z\" fill=\"#FFC24B\" fill-opacity=\"0.9\"/><path d=\"M 906.0 648.0 L 894.0 640.4 L 906.0 632.8 L 894.0 625.2 L 906.0 617.6 L 894.0 610.0\" fill=\"none\" stroke=\"#B47BF0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"786\" y1=\"648\" x2=\"884\" y2=\"648\" stroke=\"#FFC24B\" stroke-width=\"2.5\" marker-end=\"url(#arwC)\"/><line x1=\"900\" y1=\"648\" x2=\"1010\" y2=\"590\" stroke=\"#FF7A45\" stroke-width=\"2.5\" marker-end=\"url(#arwc)\"/><line x1=\"900\" y1=\"648\" x2=\"1010\" y2=\"706\" stroke=\"#FF7A45\" stroke-width=\"2.5\" marker-end=\"url(#arwc)\"/><circle cx=\"1030\" cy=\"590\" r=\"22\" fill=\"#16233A\" stroke=\"#FF7A45\" stroke-width=\"2.5\"/><text x=\"1030\" y=\"595\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\">⁸⁷Br</text><circle cx=\"1030\" cy=\"706\" r=\"22\" fill=\"#16233A\" stroke=\"#FF7A45\" stroke-width=\"2.5\"/><text x=\"1030\" y=\"711\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\">¹⁴⁶La</text><line x1=\"914\" y1=\"648\" x2=\"1190\" y2=\"622\" stroke=\"#FFC24B\" stroke-width=\"2\" marker-end=\"url(#arwC)\"/><line x1=\"1190\" y1=\"622\" x2=\"1400\" y2=\"622\" stroke=\"#FFC24B\" stroke-width=\"2\" marker-end=\"url(#arwC)\" stroke-dasharray=\"2 6\"/><line x1=\"914\" y1=\"648\" x2=\"1190\" y2=\"648\" stroke=\"#FFC24B\" stroke-width=\"2\" marker-end=\"url(#arwC)\"/><line x1=\"1190\" y1=\"648\" x2=\"1400\" y2=\"648\" stroke=\"#FFC24B\" stroke-width=\"2\" marker-end=\"url(#arwC)\" stroke-dasharray=\"2 6\"/><line x1=\"914\" y1=\"648\" x2=\"1190\" y2=\"674\" stroke=\"#FFC24B\" stroke-width=\"2\" marker-end=\"url(#arwC)\"/><line x1=\"1190\" y1=\"674\" x2=\"1400\" y2=\"674\" stroke=\"#FFC24B\" stroke-width=\"2\" marker-end=\"url(#arwC)\" stroke-dasharray=\"2 6\"/><text x=\"1184\" y=\"578\" font-size=\"13\" fill=\"#FFC24B\">3 n</text><text x=\"1414\" y=\"438\" font-size=\"15\" fill=\"#7E889C\">el proceso</text><text x=\"1414\" y=\"458\" font-size=\"15\" fill=\"#7E889C\">se repite…</text><rect x=\"40\" y=\"760\" width=\"1520\" height=\"150\" rx=\"16\" fill=\"#111F30\" fill-opacity=\"0.9\" stroke=\"#2A4056\"/><text x=\"66\" y=\"792\" font-size=\"15\" fill=\"#B8C6D6\" font-weight=\"700\">ECUACIONES (ejemplos reales de fisión del ²³⁵U)</text><text x=\"66\" y=\"828\" font-size=\"18\" fill=\"#3EC9E8\" font-family=\"Space Mono, Consolas, monospace\">²³⁵U + n → ¹⁴⁰Ba + ⁹³Kr + 3 n</text><text x=\"66\" y=\"860\" font-size=\"18\" fill=\"#5AA9FF\" font-family=\"Space Mono, Consolas, monospace\">(a)  ²³⁵U + n → ⁹⁶Rb + ¹³⁷Cs + 3 n</text><text x=\"66\" y=\"892\" font-size=\"18\" fill=\"#8FD14F\" font-family=\"Space Mono, Consolas, monospace\">(b)  ²³⁵U + n → ⁹⁰Sr + ¹⁴⁴Xe + 2 n</text><text x=\"66\" y=\"924\" font-size=\"18\" fill=\"#FFC24B\" font-family=\"Space Mono, Consolas, monospace\">(c)  ²³⁵U + n → ⁸⁷Br + ¹⁴⁶La + 3 n</text></svg><figcaption>Cada fisión de la cadena libera entre 2 y 3 neutrones nuevos: basta con que uno solo de ellos provoque otra fisión para que el proceso se sostenga.</figcaption></figure>\n<p>Si alrededor del núcleo que acaba de fisionarse hay otros núcleos fisionables, estos pueden absorber los neutrones recién liberados, fisionarse a su vez y liberar nuevos neutrones que repiten el proceso. En un reactor nuclear esa cadena se mantiene autosostenida durante todo el ciclo de operación entre recargas de combustible -actualmente entre uno y dos años-, gracias a los millones de fisiones que se producen continuamente.</p>\n<p>Hay un obstáculo que resolver primero. Los neutrones que salen de una fisión tienen una energía muy alta, del orden de 1 MeV -por eso se llaman neutrones rápidos-. Pero la energía con la que un neutrón fisiona con más probabilidad al <sup>235</sup>U es de apenas 0,025 eV, ocho órdenes de magnitud menor. Para reducir esa energía se usa un <b>moderador</b> -agua o grafito-: mediante choques sucesivos entre los neutrones y los átomos del moderador, los neutrones van perdiendo energía hasta la que necesitan para fisionar con eficacia. Ese proceso se llama termalización.</p>\n<p>Controlar la reacción en cadena consiste, en la práctica, en controlar cuántos neutrones sobreviven para producir la siguiente fisión. Las <b>barras de control</b> -materiales que absorben neutrones- se insertan o se retiran del núcleo del reactor para frenar o permitir la reacción a voluntad. Y aunque se pare la reacción en cadena por completo, el combustible sigue produciendo <b>calor residual</b> durante años: los productos de la fisión son radiactivos y se van desintegrando lentamente. Ese calor decae de forma exponencial -mucho al principio, muy poco a largo plazo-, y es la razón por la que el combustible gastado pasa unos cinco años en una piscina de refrigeración antes de poder almacenarse en seco.</p>\n<div class=\"game\" data-od=\"od5-game\">\n  <div class=\"game-intro\">\n    <p><b>Simulador de decisión · Sala de control</b></p>\n    <p>Eres el operador de turno de un reactor. Cuatro situaciones ponen a prueba si sabes qué palanca mover -moderador, barras de control o tiempo- para mantener la reacción en cadena donde debe estar.</p>\n  </div>\n</div>\n", "cards": [{"id": "od5-c1", "q": "¿Qué papel cumple exactamente el moderador -agua o grafito- en un reactor nuclear de espectro térmico?", "opts": ["Reduce la energía de los neutrones rápidos hasta la energía a la que el <sup>235</sup>U fisiona mejor", "Absorbe neutrones para frenar directamente la reacción en cadena cuando la potencia sube demasiado", "Aporta neutrones adicionales al núcleo para compensar los que se pierden por fuga fuera del reactor", "Convierte el <sup>238</sup>U no fisionable en <sup>239</sup>Pu, un isótopo capaz de fisionarse con facilidad"], "correct": 0, "why": "El moderador reduce, mediante choques, la energía de los neutrones desde ~1 MeV hasta ~0,025 eV, la energía a la que el <sup>235</sup>U fisiona con más probabilidad. Absorber neutrones es función de las barras de control, no del moderador."}, {"id": "od5-c2", "q": "¿Qué diferencia hay entre lo que hacen las barras de control y lo que hace el moderador?", "opts": ["Las barras absorben neutrones para regular la cadena; el moderador reduce su energía sin absorberlos", "Las barras reducen la energía de los neutrones; el moderador los absorbe para frenar la reacción", "Ambas cumplen una función parecida y podrían sustituirse una por otra con apenas cambios en el resultado", "Las barras solo actúan durante el arranque del reactor; el moderador solo actúa durante la parada"], "correct": 0, "why": "Son funciones distintas y complementarias: el moderador termaliza los neutrones sin eliminarlos, mientras que las barras de control los absorben para reducir su número y así regular o detener la reacción en cadena."}, {"id": "od5-c3", "q": "¿Por qué el combustible gastado pasa unos cinco años en una piscina antes de poder almacenarse en seco?", "opts": ["Porque durante esos cinco años continúan produciéndose fisiones en cadena dentro del combustible gastado", "Porque el agua de la piscina modera los neutrones residuales hasta detener por completo la radiactividad", "Porque las barras de control tardan cinco años en absorber la mayor parte de los neutrones que quedan en el núcleo", "Porque el calor residual generado por los productos de fisión, aunque decae, sigue siendo alto ese tiempo"], "correct": 3, "why": "El calor residual, producido por la desintegración de los productos de fisión, decae de forma exponencial pero sigue siendo demasiado alto para un almacenamiento en seco justo después de la parada; de ahí los años en piscina."}], "game": {"titulo": "Sala de control: mantén la reacción en cadena", "intro": "Cuatro decisiones de una guardia de operador. En cada una, elige la acción que mejor controla la reacción en cadena según lo que has aprendido sobre moderador, barras de control y calor residual.", "threshold": 6, "scenarios": [{"id": "esc1", "title": "Arranque del reactor", "situation": "El reactor arranca con el núcleo cargado de combustible fresco de <sup>235</sup>U. Los neutrones que libera cada fisión salen con una energía de aproximadamente 1 MeV, muy por encima de los 0,025 eV con los que el <sup>235</sup>U fisiona mejor. ¿Qué haces para que esos neutrones sean realmente útiles para sostener la cadena?", "options": [{"label": "Dejar que el agua actúe como moderador, para termalizar los neutrones mediante choques sucesivos", "score": 2, "fb": "Correcto: el agua frena los neutrones de 1 MeV hasta los 0,025 eV a los que el <sup>235</sup>U fisiona con más probabilidad, mediante sucesivos choques con sus átomos."}, {"label": "Retirar las barras de control por completo, para maximizar el número de neutrones disponibles", "score": 1, "fb": "Aceptable a medias: retirar barras aumenta neutrones disponibles, pero sin moderador siguen siendo demasiado rápidos para fisionar con eficacia al <sup>235</sup>U."}, {"label": "Añadir más barras de control, para reducir la energía media de los neutrones que circulan", "score": 0, "fb": "Error: las barras de control absorben neutrones, no reducen su energía. Confundes moderación con absorción, y con más barras la reacción se frena en vez de encauzarse."}]}, {"id": "esc2", "title": "Subida de potencia inesperada", "situation": "La potencia del reactor sube más rápido de lo previsto: hay demasiados neutrones disponibles para fisionar nuevos núcleos. ¿Qué acción reduce la reacción en cadena de forma directa?", "options": [{"label": "Cambiar el moderador de agua a grafito, para reducir todavía más la energía de los neutrones", "score": 1, "fb": "Aceptable a medias: el grafito también modera, pero cambiar de moderador en marcha no es la acción rápida para frenar un exceso de potencia; es una decisión de diseño, no de operación."}, {"label": "Insertar barras de control en el núcleo, para que absorban parte de los neutrones de sobra", "score": 2, "fb": "Correcto: insertar barras de control absorbe neutrones que ya no fisionan nuevos núcleos, y así se frena directamente la reacción en cadena."}, {"label": "Aumentar la recarga de combustible fresco de <sup>235</sup>U, para diluir la concentración de neutrones", "score": 0, "fb": "Error: añadir más combustible fisionable aporta más núcleos capaces de fisionarse, lo que agravaría la subida de potencia en vez de controlarla."}]}, {"id": "esc3", "title": "Parada programada", "situation": "Toca parada programada para recarga de combustible. Se inserta el juego completo de barras de control y la reacción en cadena se detiene. Un compañero pregunta si ya se puede dejar de refrigerar el núcleo. ¿Qué le respondes?", "options": [{"label": "Que no: el combustible sigue liberando calor residual durante años, aunque la cadena esté detenida", "score": 2, "fb": "Correcto: los productos de fisión siguen siendo radiactivos y se desintegran liberando calor mucho después de detener la cadena; por eso el combustible gastado pasa años en una piscina antes de almacenarse en seco."}, {"label": "Que sí, porque al detener la reacción en cadena el combustible deja de producir calor de inmediato", "score": 0, "fb": "Error: parar la cadena detiene las fisiones nuevas, pero no la desintegración de los productos de fisión ya generados, que siguen liberando calor residual."}, {"label": "Que se puede reducir la refrigeración a la mitad, porque el calor decae de forma exponencial desde el minuto uno", "score": 1, "fb": "Aceptable a medias: es verdad que el calor decae exponencialmente, con mucho al principio y poco después, pero reducir la refrigeración a la mitad justo tras la parada es prematuro: el calor residual inicial sigue siendo alto."}]}, {"id": "esc4", "title": "La pregunta del visitante", "situation": "Un visitante pregunta por qué el reactor usa un moderador en lugar de dejar que los neutrones rápidos de 1 MeV fisionen directamente el combustible sin frenarlos. ¿Cuál es la explicación correcta?", "options": [{"label": "Porque sin moderador los neutrones rápidos escaparían del núcleo interactuando con muy pocos átomos", "score": 1, "fb": "Aceptable a medias: los neutrones rápidos sí pueden escapar más fácilmente, pero la razón principal para moderar es la probabilidad de fisión, no solo evitar fugas."}, {"label": "Porque los neutrones rápidos son radiactivos por sí mismos y el moderador reduce su radiactividad", "score": 0, "fb": "Error: el neutrón no es radiactivo en ese sentido dentro del reactor; el moderador no reduce radiactividad, reduce la energía cinética del neutrón mediante choques sucesivos."}, {"label": "Porque el <sup>235</sup>U fisiona con mucha más probabilidad con neutrones lentos, de unos 0,025 eV", "score": 2, "fb": "Correcto: la probabilidad de fisión del <sup>235</sup>U es mucho mayor con neutrones termalizados a 0,025 eV que con los neutrones rápidos de 1 MeV que salen directamente de la fisión."}]}]}}]};

  function gameBox(o){
    return '<div class="game lvl-'+o.lvl+'" id="game-'+o.id+'"><div class="game-head"><div>'
      +'<div class="game-kicker">Serious game &middot; alto nivel cognitivo</div>'
      +'<h3 class="game-title">'+esc(o.game.titulo||'Simulador de decisi\u00f3n')+'</h3></div>'
      +'<div class="game-score" id="gScore">0 / 0</div></div>'
      +'<p class="game-intro">'+esc(o.game.intro||'Cada escenario te da una tarea con restricciones. Elige la opci\u00f3n m\u00e1s adecuada.')+' Umbral para superar: '+o.game.threshold+'.</p>'
      +'<div class="game-stage" id="gStage"></div></div>';
  }

  var allCards=[];
  document.getElementById('main').innerHTML = O.map(function(o){
    (o.cards||[]).forEach(function(c){ c._lvlLabel=o.lvlLabel; c._odLabel='OD'+o.n; allCards.push(c); });
    var s='<section class="od lvl-'+o.lvl+'" id="'+o.id+'" data-od="'+o.id+'">';
    s+='<div class="od-head"><span class="od-tag"><span class="n">'+esc(o.n)+'</span> &middot; '+esc(o.lvlLabel)+'</span>';
    s+='<h2>'+esc(o.titulo)+'</h2>';
    s+='<div class="objective"><span class="k">Objetivo did\u00e1ctico</span>'+(o.objetivo||'')+'</div></div>';
    s+='<div class="content">'+(o.contentHtml||'');
    if(o.game){ s+=gameBox(o); }
    var nCards=(o.cards||[]).length;
    s+='<div class="check lvl-'+o.lvl+'" data-od="'+o.id+'">'
      +(U.slug ? '<a class="mem-od-card" href="'+memoraiURL('OD'+o.n)+'" target="_blank" rel="noopener">'
        +'<span class="mem-od-icon">'+MEMORAI_ICON+'</span>'
        +'<span class="mem-od-txt"><span class="mem-od-title">Repasa este objetivo con MemorAI</span>'
        +'<span class="mem-od-sub">'+nCards+' tarjeta'+(nCards===1?'':'s')+' de repaso espaciado &middot; '+esc(o.n)+' &middot; '+esc(o.lvlLabel)+'</span></span>'
        +'<span class="mem-od-arrow">&rarr;</span></a>' : '')
      +'</div>';
    s+='</div></section>'; return s;
  }).join('');

  document.getElementById('footWrap').innerHTML='<span class="v">Unidad did\u00e1ctica generada con el skill \u00abresumen-didactico-video\u00bb</span><br>Fuente \u00fanica &middot; Bloom relativo al objetivo de referencia &middot; Flashcards + serious game condicional.';

  function toggle(el){ el.classList.toggle('flipped'); }
  document.querySelectorAll('.flip').forEach(function(f){
    f.addEventListener('click', function(){ toggle(f); });
    f.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(f);} });
  });
  function sizeCards(){
    document.querySelectorAll('.flip').forEach(function(f){
      var inner=f.querySelector('.flip-inner'); var h=0;
      f.querySelectorAll('.face').forEach(function(fc){ h=Math.max(h, fc.offsetHeight); });
      if(h>0){ inner.style.height=h+'px'; f.style.height=h+'px'; f.style.minHeight=h+'px'; inner.style.minHeight=h+'px'; }
    });
  }

  var wrap=document.getElementById('mmWrap'), svg=document.getElementById('mmLinks'), center=document.getElementById('mmCenter');
  var nodes=Array.prototype.slice.call(document.querySelectorAll('.mm-node'));
  function drawLinks(){
    if(!wrap||!svg||!center) return;
    var wr=wrap.getBoundingClientRect(); svg.setAttribute('viewBox','0 0 '+wr.width+' '+wr.height);
    var cr=center.getBoundingClientRect(); var cx=cr.left-wr.left+cr.width/2; var cy=cr.top-wr.top+cr.height; var out='';
    nodes.forEach(function(node){
      var nr=node.getBoundingClientRect(); var nx=nr.left-wr.left+nr.width/2; var ny=nr.top-wr.top;
      var dy=ny-cy; var c1y=cy+dy*0.5, c2y=ny-dy*0.5;
      out+='<path d="M '+cx+' '+cy+' C '+cx+' '+c1y+', '+nx+' '+c2y+', '+nx+' '+ny+'" class="mm-link mm-link-'+node.getAttribute('data-lvl')+'"/>';
    });
    svg.innerHTML=out;
  }
  function go(id){ var el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
  document.querySelectorAll('.mm-node,.nav-item').forEach(function(b){ b.addEventListener('click',function(){ go(b.getAttribute('data-target')); }); });
  function setActive(id){ document.querySelectorAll('.mm-node,.nav-item').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-target')===id); }); }
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(entries){ entries.forEach(function(e){ if(e.isIntersecting) setActive(e.target.getAttribute('data-od')); }); },{rootMargin:'-45% 0px -50% 0px',threshold:0});
    document.querySelectorAll('section[data-od]').forEach(function(s){ obs.observe(s); });
  }

  var gameObj=O.filter(function(o){return o.game;})[0];
  if(gameObj){
    var GAME=gameObj.game.scenarios||[]; var THRESH=gameObj.game.threshold||Math.ceil(GAME.length*2*0.75);
    var stage=document.getElementById('gStage'); var scoreEl=document.getElementById('gScore');
    var MAX=GAME.reduce(function(s,sc){return s+Math.max.apply(null,sc.options.map(function(o){return o.score;}));},0);
    var idx=0, score=0, answered=false, current=[];
    if(scoreEl) scoreEl.textContent='0 / '+MAX;
    function verdict(sc){return sc===2?'good':(sc===1?'partial':'bad');}
    function verdLabel(sc){return sc===2?'\u00d3ptima \u00b7 +2':(sc===1?'Aceptable \u00b7 +1':'Error \u00b7 +0');}
    function renderScenario(){
      answered=false; var sc=GAME[idx]; current=shuffle(sc.options);
      var h='<div class="game-progress">Escenario '+(idx+1)+' de '+GAME.length+'</div>';
      h+='<div class="scenario-title">'+esc(sc.title)+'</div><div class="scenario-sit">'+esc(sc.situation)+'</div><div class="opts">';
      current.forEach(function(o,i){ h+='<button class="opt" data-i="'+i+'"><span class="ob"></span><span>'+esc(o.label)+'</span></button>'; });
      h+='</div><div id="gFb"></div>'; stage.innerHTML=h;
      stage.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){choose(parseInt(b.getAttribute('data-i'),10));}); });
    }
    function choose(i){
      if(answered) return; answered=true; var o=current[i]; score+=o.score; if(scoreEl) scoreEl.textContent=score+' / '+MAX;
      stage.querySelectorAll('.opt').forEach(function(b,bi){
        b.disabled=true; if(bi===i) b.classList.add(verdict(current[bi].score));
        if(current[bi].score===2){ b.classList.add('good'); var t=document.createElement('span'); t.className='tag-best'; t.textContent='\u2713 \u00f3ptima'; b.appendChild(t); }
      });
      var last=(idx===GAME.length-1), v=verdict(o.score);
      document.getElementById('gFb').innerHTML='<div class="feedback '+v+'"><span class="fb-verd">'+verdLabel(o.score)+'</span>'+esc(o.fb)+'</div><button class="game-next" id="gNext">'+(last?'Ver resultado':'Siguiente escenario')+'</button>';
      document.getElementById('gNext').addEventListener('click',function(){ idx++; (idx>=GAME.length)?renderResult():renderScenario(); });
    }
    function renderResult(){
      var pass=score>=THRESH, tier, msg;
      if(score===MAX){tier='Decisi\u00f3n experta';msg='Eliges siempre con el criterio correcto del objetivo.';}
      else if(pass){tier='Superado';msg='Buen criterio. Repasa los matices para afinar del todo.';}
      else if(score>=MAX*0.5){tier='Casi';msg='Vas bien, pero revisa el razonamiento del objetivo antes de reintentarlo.';}
      else {tier='A repasar';msg='Vuelve al objetivo y a su esquema antes de reintentarlo.';}
      stage.innerHTML='<div class="game-result"><div class="gr-score">'+score+'</div><div class="gr-of">de '+MAX+' puntos \u00b7 umbral '+THRESH+'</div><div class="gr-badge '+(pass?'pass':'fail')+'">'+(pass?'Superado':'No superado')+'</div><div class="gr-tier">'+esc(tier)+'</div><div class="gr-msg">'+esc(msg)+'</div><button class="game-restart" id="gRestart">\u21bb Jugar de nuevo</button></div>';
      document.getElementById('gRestart').addEventListener('click',function(){ idx=0;score=0;answered=false; if(scoreEl) scoreEl.textContent='0 / '+MAX; renderScenario(); });
    }
    renderScenario();
  }

  var t; window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(function(){drawLinks(); sizeCards();},120); });
  window.addEventListener('load', function(){ drawLinks(); sizeCards(); });
  drawLinks(); sizeCards();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ drawLinks(); sizeCards(); }); }
  setTimeout(function(){ drawLinks(); sizeCards(); },350);
})();
</script>
<script id="figlb">
/* Figuras a pantalla completa con zoom — figlb v1.
   Delegado: funciona también con las figuras inyectadas desde window.UNIT. */
(function(){
  if(window.__figlbReady) return; window.__figlbReady=true;
  var MINK=1, MAXK=8, STEP=1.5;
  var ov,stage,pan,fit,cap,lvl,bIn,bOut,bRst,bCls;
  var k=1,tx=0,ty=0,lastFocus=null,uid=0;
  var pointers={},pinch=null,drag=null;

  function build(){
    ov=document.createElement('div'); ov.className='figlb'; ov.setAttribute('role','dialog');
    ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Figura ampliada');
    ov.innerHTML='<div class="figlb-stage"><div class="figlb-pan"><div class="figlb-fit"></div></div></div>'+
      '<div class="figlb-help">Rueda o pellizco para acercar · arrastra para mover · Esc para cerrar</div>'+
      '<div class="figlb-bar">'+
        '<button type="button" data-a="out" aria-label="Alejar">−</button>'+
        '<span class="figlb-lvl">100%</span>'+
        '<button type="button" data-a="in" aria-label="Acercar">+</button>'+
        '<button type="button" data-a="rst" aria-label="Restablecer zoom">↻</button>'+
        '<button type="button" data-a="cls" aria-label="Cerrar">✕</button>'+
      '</div><div class="figlb-cap"></div>';
    document.body.appendChild(ov);
    stage=ov.querySelector('.figlb-stage'); pan=ov.querySelector('.figlb-pan');
    fit=ov.querySelector('.figlb-fit'); cap=ov.querySelector('.figlb-cap'); lvl=ov.querySelector('.figlb-lvl');
    bOut=ov.querySelector('[data-a=out]'); bIn=ov.querySelector('[data-a=in]');
    bRst=ov.querySelector('[data-a=rst]'); bCls=ov.querySelector('[data-a=cls]');

    bIn.addEventListener('click',function(){zoomCenter(k*STEP);});
    bOut.addEventListener('click',function(){zoomCenter(k/STEP);});
    bRst.addEventListener('click',function(){k=1;tx=0;ty=0;apply();});
    bCls.addEventListener('click',close);
    stage.addEventListener('click',function(e){ if(e.target===stage||e.target===pan) close(); });
    stage.addEventListener('wheel',function(e){
      e.preventDefault();
      var d=e.deltaY*(e.deltaMode===1?16:(e.deltaMode===2?100:1));
      zoomAt(e.clientX,e.clientY, k*clamp(Math.exp(-d*0.0022),0.6,1.66));
    },{passive:false});
    stage.addEventListener('pointerdown',onDown);
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
    window.addEventListener('pointercancel',onUp);
    document.addEventListener('keydown',function(e){
      if(!ov.classList.contains('open')) return;
      if(e.key==='Escape'){e.preventDefault();close();}
      else if(e.key==='+'||e.key==='='){e.preventDefault();zoomCenter(k*STEP);}
      else if(e.key==='-'){e.preventDefault();zoomCenter(k/STEP);}
      else if(e.key==='0'){e.preventDefault();k=1;tx=0;ty=0;apply();}
    });
  }

  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function clampPan(){
    var r=stage.getBoundingClientRect();
    var mx=Math.max(0,(r.width*k-r.width)/2), my=Math.max(0,(r.height*k-r.height)/2);
    tx=clamp(tx,-mx,mx); ty=clamp(ty,-my,my);
  }
  function apply(){
    clampPan();
    pan.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+k.toFixed(3)+')';
    lvl.textContent=Math.round(k*100)+'%';
    bOut.disabled=k<=MINK+0.001; bIn.disabled=k>=MAXK-0.001;
  }
  function zoomAt(cx,cy,nk){
    nk=clamp(nk,MINK,MAXK); if(nk===k) return;
    var r=stage.getBoundingClientRect();
    var ox=cx-r.left-r.width/2, oy=cy-r.top-r.height/2;
    tx=ox-(ox-tx)*(nk/k); ty=oy-(oy-ty)*(nk/k); k=nk;
    if(k===1){tx=0;ty=0;}
    apply();
  }
  function zoomCenter(nk){
    var r=stage.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, nk);
  }

  function onDown(e){
    if(!ov.classList.contains('open')) return;
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(pointers);
    if(ids.length===2){
      drag=null; pinch=dist(ids); pinch={d:pinch,k:k};
      pan.classList.add('dragging');
    } else if(ids.length===1 && k>1){
      drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty}; pan.classList.add('dragging');
    }
  }
  function dist(ids){
    var a=pointers[ids[0]],b=pointers[ids[1]];
    return Math.hypot(a.x-b.x,a.y-b.y)||1;
  }
  function onMove(e){
    if(!(e.pointerId in pointers)) return;
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(pointers);
    if(pinch && ids.length===2){
      var a=pointers[ids[0]],b=pointers[ids[1]];
      zoomAt((a.x+b.x)/2,(a.y+b.y)/2, pinch.k*(dist(ids)/pinch.d));
    } else if(drag){
      tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y); apply();
    }
  }
  function onUp(e){
    delete pointers[e.pointerId];
    if(Object.keys(pointers).length<2) pinch=null;
    if(Object.keys(pointers).length===0){ drag=null; pan.classList.remove('dragging'); }
  }

  /* Clona el nodo renombrando ids para no colisionar con el original del documento
     (markers de flecha, gradientes, clipPaths…). */
  function cloneIsolated(node){
    var c=node.cloneNode(true), sfx='--figlb'+(++uid), map={};
    Array.prototype.forEach.call(c.querySelectorAll('[id]'),function(el){
      var o=el.id; map[o]=o+sfx; el.id=map[o];
    });
    if(c.id){ map[c.id]=c.id+sfx; c.id=map[c.id]; }
    if(!Object.keys(map).length) return c;
    var all=[c].concat(Array.prototype.slice.call(c.querySelectorAll('*')));
    all.forEach(function(el){
      Array.prototype.forEach.call(el.attributes,function(at){
        var v=at.value;
        if(v.indexOf('#')===-1) return;
        var nv=v;
        for(var o in map){
          nv=nv.split('url(#'+o+')').join('url(#'+map[o]+')');
          if(nv==='#'+o) nv='#'+map[o];
        }
        if(nv!==v) el.setAttribute(at.name,nv);
      });
    });
    return c;
  }

  function aspectOf(svg){
    var vb=(svg.getAttribute('viewBox')||'').trim().split(/[\s,]+/);
    if(vb.length===4){
      var w=parseFloat(vb[2]),h=parseFloat(vb[3]);
      if(w>0&&h>0) return w+'/'+h;
    }
    var aw=parseFloat(svg.getAttribute('width')),ah=parseFloat(svg.getAttribute('height'));
    if(aw>0&&ah>0) return aw+'/'+ah;
    return '16/9';
  }

  function open(figure){
    var src=figure.querySelector('svg')||figure.querySelector('img');
    if(!src) return;
    if(!ov) build();
    fit.innerHTML=''; fit.classList.remove('raster');
    var c=cloneIsolated(src);
    if(c.tagName.toLowerCase()==='svg'){
      c.removeAttribute('width'); c.removeAttribute('height');
      fit.style.setProperty('--figlb-ar', aspectOf(src));
    } else {
      fit.classList.add('raster');
    }
    c.removeAttribute('id');
    fit.appendChild(c);
    var fc=figure.querySelector('figcaption');
    cap.textContent=fc?fc.textContent.trim():'';
    k=1;tx=0;ty=0;
    lastFocus=document.activeElement;
    ov.classList.add('open'); document.body.classList.add('figlb-lock');
    apply(); bCls.focus();
  }
  function close(){
    if(!ov) return;
    ov.classList.remove('open'); document.body.classList.remove('figlb-lock');
    fit.innerHTML=''; cap.textContent=''; pointers={}; pinch=null; drag=null;
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* Marca las figuras ampliables (también las que se inyectan después). */
  function mark(){
    Array.prototype.forEach.call(document.querySelectorAll('figure'),function(f){
      if(f.classList.contains('figlb-able')) return;
      if(ov && ov.contains(f)) return;
      if(!f.querySelector('svg') && !f.querySelector('img')) return;
      f.classList.add('figlb-able');
      f.setAttribute('tabindex','0');
      f.setAttribute('role','button');
      f.setAttribute('aria-label','Ampliar figura a pantalla completa');
      var h=document.createElement('span');
      h.className='figlb-hint'; h.setAttribute('aria-hidden','true');
      h.textContent='⤢ Ampliar';
      f.appendChild(h);
    });
  }

  document.addEventListener('click',function(e){
    var f=e.target.closest?e.target.closest('figure.figlb-able'):null;
    if(!f||(ov&&ov.contains(f))) return;
    if(e.target.closest('a,button,input,select,textarea')) return;
    open(f);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var f=document.activeElement;
    if(!f||!f.classList||!f.classList.contains('figlb-able')) return;
    e.preventDefault(); open(f);
  });

  function boot(){
    if(!ov) build();
    mark();
    if(window.MutationObserver){
      new MutationObserver(function(){mark();})
        .observe(document.body,{childList:true,subtree:true});
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
