<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidad didáctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420; --surface:#18202E; --surface-2:#1E2738;
    --line:#2C3850; --line-soft:#232E42;
    --ink:#E8ECF4; --ink-soft:#B2BBCC; --ink-faint:#7E889C;

    --comprender:#34C9B6; --comprender-tint:rgba(52,201,182,.13);
    --analizar:#5AA3EC;   --analizar-tint:rgba(90,163,236,.13);
    --aplicar:#EFAC4A;    --aplicar-tint:rgba(239,172,74,.14);
    --evaluar:#EC6F84;    --evaluar-tint:rgba(236,111,132,.14);

    --maxw:1120px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter",system-ui,sans-serif; line-height:1.62;
    font-size:16.5px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}

  /* ---------- HEADER ---------- */
  header.hero{padding:54px 0 26px; border-bottom:1px solid var(--line)}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-family:"Space Mono",monospace;
    font-size:12.5px; letter-spacing:.03em; color:var(--ink-faint); text-decoration:none;
    margin-bottom:18px; transition:color .15s ease;
  }
  .back-link:hover{color:var(--ink-soft)}
  .crumb{
    font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.04em;
    color:var(--ink-faint); text-transform:uppercase; margin-bottom:22px;
  }
  .crumb b{color:var(--ink-soft); font-weight:700}
  .eyebrow{
    font-family:"Space Mono",monospace; font-size:13px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase; color:var(--evaluar);
    margin-bottom:14px;
  }
  h1{
    font-family:"Space Grotesk",sans-serif; font-weight:700;
    font-size:clamp(2rem,5.2vw,3.4rem); line-height:1.05; letter-spacing:-.02em;
    margin:0 0 22px; max-width:18ch; color:var(--ink);
  }
  .meta{display:flex; flex-wrap:wrap; gap:8px 26px; font-size:14px; color:var(--ink-soft)}
  .meta .k{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:2px}
  .ref-obj{
    margin-top:24px; padding:16px 18px; background:var(--surface);
    border:1px solid var(--line); border-left:4px solid var(--evaluar); border-radius:10px;
    font-size:14.5px; max-width:760px; color:var(--ink-soft);
  }
  .ref-obj .k{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:4px}
  .ref-obj em{font-style:normal; color:var(--evaluar); font-weight:600}

  /* ---------- MIND MAP ---------- */
  .mm-section{padding:40px 0 30px}
  .mm-title{font-family:"Space Mono",monospace; font-size:12px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-faint); text-align:center; margin-bottom:6px}
  .mm-sub{text-align:center; color:var(--ink-soft); font-size:14px; margin:0 0 28px}
  .mm-wrap{position:relative; min-height:280px}
  .mm-links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
  .mm-link{fill:none; stroke-width:2.5; opacity:.55}
  .mm-link-comprender{stroke:var(--comprender)}
  .mm-link-analizar{stroke:var(--analizar)}
  .mm-link-aplicar{stroke:var(--aplicar)}
  .mm-link-evaluar{stroke:var(--evaluar)}
  .mm-center{
    position:relative; z-index:1; width:max-content; max-width:340px; margin:0 auto 56px;
    background:var(--surface-2); color:var(--ink); border:1px solid rgba(255,255,255,.10);
    border-radius:16px; padding:18px 24px; text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .mm-center .lbl{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px}
  .mm-center .txt{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:17px; line-height:1.2}
  .mm-nodes{position:relative; z-index:1; display:flex; flex-wrap:wrap; justify-content:center; gap:16px}
  .mm-node{
    flex:1 1 175px; max-width:200px; min-width:150px;
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c);
    border-radius:12px; padding:14px 14px 16px; cursor:pointer; text-align:left;
    font-family:inherit; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .mm-node:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(0,0,0,.5)}
  .mm-node:focus-visible{outline:3px solid var(--c); outline-offset:2px}
  .mm-node.active{box-shadow:0 10px 26px rgba(0,0,0,.5); border-color:var(--c)}
  .mm-node .num{font-family:"Space Mono",monospace; font-size:22px; font-weight:700; color:var(--c); line-height:1}
  .mm-node .lvl{display:inline-block; font-family:"Space Mono",monospace; font-size:10px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--c);
    background:var(--c-tint); border-radius:20px; padding:2px 9px; margin:8px 0 7px}
  .mm-node .nt{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:14.5px; line-height:1.2; color:var(--ink)}
  .lvl-comprender{--c:var(--comprender); --c-tint:var(--comprender-tint)}
  .lvl-analizar{--c:var(--analizar); --c-tint:var(--analizar-tint)}
  .lvl-aplicar{--c:var(--aplicar); --c-tint:var(--aplicar-tint)}
  .lvl-evaluar{--c:var(--evaluar); --c-tint:var(--evaluar-tint)}

  /* ---------- LAYOUT BODY ---------- */
  .body-grid{display:grid; grid-template-columns:200px 1fr; gap:48px; padding:30px 0 80px; align-items:start}
  nav.rail{position:sticky; top:24px; align-self:start}
  .rail-title{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:14px}
  .nav-item{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
    background:none; border:none; cursor:pointer; padding:9px 0; font-family:inherit;
    color:var(--ink-soft); border-top:1px solid var(--line-soft); transition:color .15s}
  .nav-item:hover{color:var(--ink)}
  .nav-item .dot{width:10px; height:10px; border-radius:50%; background:var(--c); margin-top:6px; flex:none}
  .nav-item .ni-txt{font-size:13.5px; line-height:1.3}
  .nav-item .ni-num{font-family:"Space Mono",monospace; font-weight:700; font-size:12px}
  .nav-item.active{color:var(--ink); font-weight:600}
  .nav-item.active .ni-txt{font-weight:600}

  /* ---------- SECTIONS ---------- */
  section.od{scroll-margin-top:20px; margin-bottom:64px; padding-top:6px}
  .od-head{border-left:4px solid var(--c); padding-left:20px; margin-bottom:24px}
  .od-tag{display:inline-flex; align-items:center; gap:8px; font-family:"Space Mono",monospace;
    font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--c);
    background:var(--c-tint); border-radius:20px; padding:4px 12px; margin-bottom:14px}
  .od-tag .n{font-weight:700}
  h2{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:clamp(1.5rem,3vw,2rem);
    line-height:1.14; letter-spacing:-.015em; margin:0 0 14px; color:var(--ink)}
  .objective{background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-size:14.5px; color:var(--ink-soft)}
  .objective .k{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--c); display:block; margin-bottom:5px; font-weight:700}
  .objective b{color:var(--ink); font-weight:600}
  .content{margin-top:26px}
  .content p{margin:0 0 16px; color:var(--ink-soft)}
  .content h3{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.12rem;
    margin:30px 0 10px; color:var(--ink)}
  .lead{font-size:1.08rem; color:var(--ink) !important}
  .content b{color:var(--ink)}

  /* tables */
  .tbl-wrap{overflow-x:auto; margin:22px 0; border:1px solid var(--line); border-radius:12px}
  table{border-collapse:collapse; width:100%; min-width:520px; font-size:14px; background:var(--surface)}
  th,td{text-align:left; padding:12px 15px; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-soft)}
  thead th{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  td b, th b{font-weight:600; color:var(--ink)}
  .yes{color:var(--comprender); font-weight:700}
  .no{color:var(--ink-faint)}

  /* callout */
  .callout{display:flex; gap:14px; background:var(--c-tint); border-radius:12px; padding:16px 18px; margin:22px 0;
    border:1px solid color-mix(in srgb, var(--c) 32%, transparent)}
  .callout .ic{font-family:"Space Mono",monospace; font-weight:700; color:var(--c); font-size:13px;
    letter-spacing:.05em; text-transform:uppercase; flex:none; padding-top:1px}
  .callout p{margin:0; font-size:14.5px; color:var(--ink) !important}
  .aula{--c:var(--analizar); --c-tint:var(--analizar-tint)}

  /* figure / schematic */
  figure{margin:24px 0; border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:22px 18px 14px}
  figure svg{display:block; width:100%; height:auto}
  figure img{display:block; width:100%; height:auto}
  figcaption{font-size:13px; color:var(--ink-soft); text-align:center; margin-top:12px;
    font-family:"Space Mono",monospace; letter-spacing:.02em}

  /* MemorAI — enlace de repaso al final del tema */
  .memorai-promo{padding:34px 0 44px; text-align:center}
  .memorai-promo a{display:inline-flex; flex-direction:column; align-items:center; gap:12px; text-decoration:none}
  .memorai-promo img{display:block; width:160px; height:auto; border-radius:12px;
    transition:transform .15s ease, filter .15s ease}
  .memorai-promo a:hover img{transform:translateY(-3px); filter:brightness(1.08)}
  .memorai-promo .mp-cta{font-family:"Space Mono",monospace; font-size:12.5px; letter-spacing:.04em;
    color:var(--ink-faint); transition:color .15s ease}
  .memorai-promo a:hover .mp-cta{color:var(--ink-soft)}

  /* hueco de imagen pendiente */
  .img-prompt{margin:24px 0; border:1.5px dashed var(--line); border-radius:14px; padding:20px 20px 18px;
    background:color-mix(in srgb, var(--surface) 60%, transparent)}
  .img-prompt .ip-lbl{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px; display:flex; align-items:center; gap:8px}
  .img-prompt .ip-lbl::before{content:"◇"; color:var(--ink-faint)}
  .img-prompt .ip-prompt{font-family:"Space Mono",monospace; font-size:12.5px; line-height:1.6; color:var(--ink-soft);
    white-space:pre-wrap}

  footer{border-top:1px solid var(--line); padding:34px 0 60px; color:var(--ink-faint); font-size:13px;
    font-family:"Space Mono",monospace; letter-spacing:.02em}
  footer .v{color:var(--ink-soft)}

  @media (max-width:860px){
    .body-grid{grid-template-columns:1fr; gap:0}
    nav.rail{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .mm-node{transition:none}
  }

  /* ---------- V2 · FLASHCARDS (datos; el grid inline ya no se renderiza -> ver .mem-od-card) ---------- */
  .check{margin-top:40px; padding-top:28px; border-top:1px solid var(--line)}
  .check-h{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.14rem; color:var(--ink); margin-bottom:4px}
  .check-h .badge{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--c); background:var(--c-tint); border-radius:20px; padding:3px 10px; margin-left:8px; vertical-align:middle}
  .check-sub{font-size:13.5px; color:var(--ink-faint); margin:0 0 20px}
  .fc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:18px}
  /* Tarjeta de acceso a MemorAI al final de cada objetivo -> sustituye a las flashcards inline */
  .mem-od-card{display:flex; align-items:center; gap:16px; text-decoration:none;
    background:var(--surface); border:1px solid var(--c); border-radius:16px; padding:18px 20px;
    transition:filter .15s ease, transform .15s ease, border-color .15s ease}
  .mem-od-card:hover{filter:brightness(1.1); transform:translateY(-2px)}
  .mem-od-icon{flex:none; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--c-tint); color:var(--c)}
  .mem-od-icon svg{width:24px; height:24px}
  .mem-od-txt{flex:1 1 auto; display:flex; flex-direction:column; gap:3px; min-width:0}
  .mem-od-title{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:15.5px; color:var(--ink)}
  .mem-od-sub{font-family:"Space Mono",monospace; font-size:11.5px; letter-spacing:.02em; color:var(--ink-faint)}
  .mem-od-arrow{flex:none; font-size:20px; color:var(--c); transition:transform .15s ease}
  .mem-od-card:hover .mem-od-arrow{transform:translateX(4px)}
  .flip{perspective:1300px; cursor:pointer; min-height:240px; outline:none}
  .flip-inner{position:relative; width:100%; min-height:240px;
    transition:transform .55s cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .flip:focus-visible .face-front{box-shadow:0 0 0 3px var(--c)}
  .face{position:absolute; top:0; left:0; width:100%;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c);
    border-radius:14px; padding:18px 18px 16px}
  .face-back{transform:rotateY(180deg)}
  .fc-tag{display:flex; justify-content:space-between; font-family:"Space Mono",monospace; font-size:10.5px;
    letter-spacing:.06em; text-transform:uppercase; color:var(--c); margin-bottom:11px}
  .fc-q{font-size:15px; font-weight:600; color:var(--ink); line-height:1.4; margin-bottom:13px}
  .fc-opts{list-style:none; margin:0; padding:0; font-size:13.5px; color:var(--ink-soft)}
  .fc-opts li{padding:5px 0 5px 24px; position:relative; line-height:1.4}
  .fc-opts li .ltr{position:absolute; left:0; top:5px; font-family:"Space Mono",monospace; font-weight:700; color:var(--ink-faint)}
  .fc-hint{margin-top:14px; font-family:"Space Mono",monospace; font-size:10.5px; color:var(--ink-faint); text-align:right}
  .fc-correct{display:inline-block; font-family:"Space Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.05em;
    color:var(--c); background:var(--c-tint); border-radius:20px; padding:3px 11px; margin-bottom:11px}
  .fc-ans{font-size:15px; font-weight:600; color:var(--ink); line-height:1.4; margin-bottom:11px}
  .fc-why{font-size:13.5px; color:var(--ink-soft); line-height:1.5}
  .fc-why b{color:var(--ink)}

  /* ---------- V3 · SERIOUS GAME ---------- */
  .game{margin-top:40px; padding:24px 22px 22px; background:var(--surface); border:1px solid var(--line);
    border-top:4px solid var(--c); border-radius:16px}
  .game-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:8px}
  .game-kicker{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--c); margin-bottom:6px}
  .game-title{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:1.18rem; color:var(--ink); margin:0}
  .game-score{font-family:"Space Mono",monospace; font-weight:700; font-size:14px; color:var(--c);
    background:var(--c-tint); border-radius:20px; padding:5px 13px; white-space:nowrap}
  .game-intro{font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5}
  .game-progress{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px}
  .scenario-title{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.04rem; color:var(--ink); margin:0 0 6px}
  .scenario-sit{font-size:14.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 16px}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; cursor:pointer;
    font-family:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line);
    border-radius:11px; padding:13px 15px; transition:border-color .15s, background .15s, transform .1s}
  .opt:hover:not(:disabled){border-color:var(--c); transform:translateY(-1px)}
  .opt:disabled{cursor:default}
  .opt .ob{width:9px; height:9px; border-radius:50%; background:var(--ink-faint); margin-top:5px; flex:none}
  .opt.good{border-color:var(--comprender); background:var(--comprender-tint)}
  .opt.partial{border-color:var(--aplicar); background:var(--aplicar-tint)}
  .opt.bad{border-color:var(--evaluar); background:var(--evaluar-tint)}
  .opt .tag-best{margin-left:auto; align-self:center; flex:none; font-family:"Space Mono",monospace;
    font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--comprender)}
  .feedback{margin-top:14px; padding:13px 15px; border-radius:11px; font-size:13.5px; line-height:1.55; border-left:4px solid var(--c); color:var(--ink-soft)}
  .feedback.good{border-color:var(--comprender); background:var(--comprender-tint)}
  .feedback.partial{border-color:var(--aplicar); background:var(--aplicar-tint)}
  .feedback.bad{border-color:var(--evaluar); background:var(--evaluar-tint)}
  .feedback .fb-verd{font-family:"Space Mono",monospace; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:5px}
  .feedback.good .fb-verd{color:var(--comprender)}
  .feedback.partial .fb-verd{color:var(--aplicar)}
  .feedback.bad .fb-verd{color:var(--evaluar)}
  .game-next{margin-top:16px; font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    background:var(--c); color:#1a0b0e; border:none; border-radius:10px; padding:11px 22px; transition:transform .12s, filter .12s}
  .game-next:hover{transform:translateY(-2px); filter:brightness(1.07)}
  .game-result{text-align:center; padding:14px 0 6px}
  .gr-score{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:2.7rem; color:var(--c); line-height:1}
  .gr-of{font-family:"Space Mono",monospace; font-size:12.5px; color:var(--ink-faint); margin-bottom:14px}
  .gr-badge{display:inline-block; font-family:"Space Mono",monospace; font-size:11px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; border-radius:20px; padding:5px 14px; margin-bottom:16px}
  .gr-badge.pass{color:var(--comprender); background:var(--comprender-tint)}
  .gr-badge.fail{color:var(--evaluar); background:var(--evaluar-tint)}
  .gr-tier{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:1.18rem; color:var(--ink); margin-bottom:6px}
  .gr-msg{font-size:14px; color:var(--ink-soft); max-width:480px; margin:0 auto 18px; line-height:1.5}
  .game-restart{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:14px; cursor:pointer; display:inline-block;
    background:transparent; color:var(--c); border:1px solid var(--c); border-radius:10px; padding:10px 22px}
  .game-restart:hover{background:var(--c-tint)}



  /* ---------- FIGURAS AMPLIABLES (figlb v1) ---------- */
  figure{position:relative}
  figure.figlb-able{cursor:zoom-in}
  figure.figlb-able:focus-visible{outline:2px solid var(--analizar); outline-offset:3px}
  figure.figlb-able .figlb-hint{
    position:absolute; top:10px; right:10px; z-index:2;
    display:flex; align-items:center; gap:6px; pointer-events:none;
    font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); background:color-mix(in srgb, var(--bg) 72%, transparent);
    border:1px solid var(--line); border-radius:8px; padding:4px 8px;
    opacity:0; transition:opacity .15s ease, color .15s ease;
  }
  figure.figlb-able:hover .figlb-hint,
  figure.figlb-able:focus-visible .figlb-hint{opacity:1; color:var(--ink-soft)}

  .figlb{
    position:fixed; inset:0; z-index:9999; display:none;
    background:color-mix(in srgb, var(--bg) 94%, #000);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  .figlb.open{display:block}
  body.figlb-lock{overflow:hidden}
  .figlb-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:64px 28px 92px; overflow:hidden; touch-action:none;
  }
  .figlb-pan{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%; transform-origin:50% 50%; will-change:transform;
    transition:transform .16s ease-out;
  }
  .figlb-pan.dragging{transition:none; cursor:grabbing}
  .figlb-fit{
    width:100%; max-width:100%; max-height:100%; aspect-ratio:var(--figlb-ar, 16/9);
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px;
  }
  .figlb-fit.raster{width:auto; height:auto; aspect-ratio:auto; padding:10px}
  .figlb-fit svg{display:block; width:100%; height:100%}
  .figlb-fit img{display:block; max-width:calc(100vw - 76px); max-height:calc(100vh - 176px); width:auto; height:auto}

  .figlb-cap{
    position:absolute; left:0; right:0; bottom:26px; margin:0 auto; max-width:74ch; padding:0 28px;
    font-family:"Space Mono",monospace; font-size:13px; line-height:1.5; color:var(--ink-soft);
    text-align:center; pointer-events:none;
  }
  .figlb-bar{
    position:absolute; top:18px; right:22px; display:flex; align-items:center; gap:8px; z-index:2;
  }
  .figlb-bar button{
    display:flex; align-items:center; justify-content:center; min-width:38px; height:38px; padding:0 11px;
    background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:10px;
    font-family:"Space Mono",monospace; font-size:15px; line-height:1; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .figlb-bar button:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink-faint)}
  .figlb-bar button:disabled{opacity:.4; cursor:default}
  .figlb-bar .figlb-lvl{
    min-width:56px; text-align:center; font-family:"Space Mono",monospace; font-size:12px;
    color:var(--ink-faint); letter-spacing:.04em;
  }
  .figlb-help{
    position:absolute; left:22px; top:26px; font-family:"Space Mono",monospace; font-size:11.5px;
    letter-spacing:.04em; color:var(--ink-faint); pointer-events:none;

  }

window.UNIT = {"curso": "Fundamentos de Energía Nuclear (FEN)", "modulo": "M1 · Física nuclear y radiación", "numTema": "1.1", "tema": "Física nuclear y radiación", "titulo": "Física nuclear y radiación: del átomo al núcleo, fisión y fusión", "tituloPagina": "1.1 Física nuclear y radiación · FEN", "tituloCorto": "Física nuclear y radiación", "fuente": "Ciencia y Tecnología Nuclear, Cap. 1 · Física nuclear y radiación (M. Fernández Ordóñez, G. Jiménez Varas — Jóvenes Nucleares, Sociedad Nuclear Española)", "formato": "documento", "objetivoReferencia": "Explicar el comportamiento del núcleo atómico -su estructura, su estabilidad y las reacciones que libera- como base para entender el funcionamiento de una central nuclear.", "objetivoInferido": true, "slug": "fisica_nuclear_radiacion", "unitHref": "unidad_fisica_nuclear_radiacion.html", "memoraiHref": "memorai.html", "objetivos": [{"id": "od1", "n": "1", "lvl": "comprender", "lvlLabel": "Comprender", "navTitle": "Modelos atómicos", "titulo": "De Dalton a Schrödinger: la evolución del modelo atómico", "objetivo": "Explicar cómo ha evolucionado el modelo atómico, desde Dalton hasta Schrödinger, apoyándose en el experimento que forzó cada cambio.", "contentHtml": "\n<p class=\"lead\">Durante más de dos mil años la pregunta \"¿de qué está hecha la materia?\" tuvo respuestas filosóficas. Solo en poco más de un siglo -de 1808 a 1932- la física convirtió esa pregunta en un modelo experimental, y lo hizo a base de que cada modelo nuevo cayera ante un experimento que el anterior no podía explicar.</p>\n<p>El filósofo griego Demócrito ya había propuesto hacia el 400 a.C. que la materia estaba formada por átomos indivisibles. Pero la primera versión con base experimental llegó con John Dalton en 1808: átomos indivisibles, iguales entre sí dentro de un mismo elemento químico y sin carga eléctrica. Ese modelo se sostuvo casi un siglo, hasta que en 1897 J. J. Thomson descubrió el electrón, una partícula mucho más pequeña que el átomo y con carga. Un átomo \"indivisible\" que contenía algo más pequeño en su interior ya no podía ser indivisible.</p>\n<p>Thomson resolvió la contradicción proponiendo un átomo formado por una masa de carga positiva con los electrones incrustados en ella, como pasas en un pudin. Fue Ernest Rutherford quien, en 1911, puso ese modelo a prueba bombardeando láminas de oro muy finas con partículas alfa. Si Thomson tenía razón, casi todas las partículas debían rebotar al chocar con esa masa positiva densa. Ocurrió lo contrario: la inmensa mayoría atravesó la lámina como si no hubiera nada, y solo unas pocas se desviaron o rebotaron. La única explicación era que el átomo está casi hueco, con casi toda su masa y su carga positiva concentrada en un núcleo diminuto en el centro.</p>\n<figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_timeline_modelos.jpg\" alt=\"Linea de tiempo de los modelos atomicos, de Democrito a Schrodinger\" loading=\"lazy\"><figcaption>Seis hitos, seis modelos: cada salto ocurrió porque un experimento hacía insostenible el modelo anterior, desde la esfera indivisible de Demócrito hasta la nube de probabilidad de Schrödinger.</figcaption></figure>\n<p>El modelo de Rutherford todavía tenía un problema: según la física clásica, un electrón girando alrededor de un núcleo debería perder energía e ir cayendo en espiral hasta estrellarse contra él. El átomo se desmoronaría en una fracción de segundo, y evidentemente no lo hace. Niels Bohr, discípulo de Rutherford, resolvió esto en 1913 introduciendo la física cuántica: los electrones solo pueden ocupar determinadas capas u órbitas discretas, nunca posiciones intermedias. Entre 1926 y 1932, Erwin Schrödinger llevó la mecánica cuántica hasta sus últimas consecuencias: los electrones no orbitan como planetas, sino que existen como una nube de probabilidad alrededor del núcleo. Es el modelo que sigue vigente hoy. Ese mismo año, 1932, James Chadwick confirmó experimentalmente la existencia del neutrón, la partícula neutra que completaba la imagen del núcleo.</p>\n<div class=\"callout\"><span class=\"ic\">Nota</span><p>El hilo de esta historia no termina en un modelo estático: en 1938-39, Otto Hahn, Lise Meitner y Fritz Strassmann bombardearon uranio con neutrones y obtuvieron bario, un núcleo con la mitad de masa. Habían fisionado el átomo sin saberlo del todo -y esa observación es la puerta de entrada al resto de esta unidad.</p></div>\n", "cards": [{"id": "od1-c1", "q": "¿Qué observación experimental de Thomson en 1897 hizo insostenible el modelo de Dalton?", "opts": ["Que las partículas alfa atravesaban láminas de oro sin apenas desviarse en su trayectoria", "Que el átomo contenía una partícula cargada -el electrón- mucho más pequeña que el propio átomo", "Que los electrones solo podían ocupar determinadas capas discretas alrededor del núcleo", "Que el neutrón era una partícula sin carga capaz de residir establemente dentro del núcleo"], "correct": 1, "why": "Dalton sostenía que el átomo era indivisible y sin carga. Un electrón cargado y más pequeño que el átomo contradecía las dos ideas a la vez, y forzó a Thomson a proponer un átomo con partículas dentro."}, {"id": "od1-c2", "q": "En el experimento de Rutherford, ¿qué resultado obligó a abandonar el modelo de Thomson?", "opts": ["Que casi todas las partículas alfa atravesaran la lámina de oro en vez de rebotar contra ella", "Que el electrón resultara tener masa negativa en lugar de masa positiva, al medirlo con precisión", "Que la mitad de las partículas alfa quedara atrapada de forma permanente dentro del núcleo de oro", "Que las partículas alfa emitidas resultaran ser en realidad electrones de muy alta energía"], "correct": 0, "why": "El modelo de Thomson predecía una masa positiva densa que debía frenar o rebotar la mayoría de las partículas alfa. Que casi todas pasaran de largo solo se explica si el átomo está casi vacío, con la masa concentrada en un núcleo pequeño."}, {"id": "od1-c3", "q": "¿Qué aportó el modelo de Bohr de 1913 que el de Rutherford no explicaba?", "opts": ["Por qué los electrones no caen en espiral hacia el núcleo, al limitarlos a capas discretas fijas", "Por qué el núcleo concentra más del 99% de la masa total del átomo en un volumen tan pequeño", "Por qué las partículas alfa emitidas por el radio tienen carga positiva en lugar de carga neutra", "Por qué un mismo elemento químico puede presentar varios isótopos con distinto número de neutrones"], "correct": 0, "why": "La física clásica predecía que un electrón en órbita libre perdería energía y caería sobre el núcleo. Bohr introdujo la física cuántica para fijar a los electrones en capas discretas, sin posiciones intermedias, y así el átomo deja de ser inestable."}, {"id": "od1-c4", "q": "¿Qué distingue al modelo de Schrödinger (1926-32) del modelo de Bohr que lo precede?", "opts": ["Que sitúa el descubrimiento del neutrón antes que el de las capas electrónicas discretas de Bohr", "Que reemplaza las órbitas fijas por una nube de probabilidad, sin trayectoria definida para el electrón", "Que propone por primera vez un núcleo positivo rodeado de electrones en vez de un átomo macizo", "Que descarta la existencia de electrones y explica la carga del átomo solo con protones y neutrones"], "correct": 1, "why": "Bohr ya había introducido capas discretas; el aporte de Schrödinger, con la mecánica cuántica completa, es sustituir la idea de órbita por una distribución de probabilidad: no se puede decir dónde está el electrón, solo dónde es más probable encontrarlo."}]}, {"id": "od2", "n": "2", "lvl": "comprender", "lvlLabel": "Comprender", "navTitle": "Átomo, núcleo e isótopos", "titulo": "La estructura del átomo: del núcleo a los isótopos", "objetivo": "Describir la estructura del átomo y del núcleo -nucleones, isótopos y número másico- situando su tamaño en la escala del universo a la partícula.", "contentHtml": "\n<p class=\"lead\">Hoy se sabe que el átomo consta de un núcleo central -que concentra más del 99% de su masa- rodeado de electrones dispuestos según distribuciones de probabilidad. El núcleo, a su vez, no es un ente fundamental: está formado por protones y neutrones, llamados genéricamente <b>nucleones</b>, que tampoco son indivisibles, sino que están compuestos de partículas aún más pequeñas llamadas quarks.</p>\n<p>Para hacerse una idea de lo vacío que está el átomo conviene comparar escalas muy distintas entre sí. Si el núcleo de hidrógeno -formado por un único protón- fuera del tamaño de un balón de fútbol en el centro de un estadio, el átomo completo ocuparía todo el estadio: el núcleo es unas 100.000 veces más pequeño que el átomo que lo contiene.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Objeto</th><th>Tamaño aproximado</th></tr></thead><tbody>\n<tr><td>Galaxia</td><td>10<sup>22</sup> m</td></tr>\n<tr><td>Sistema solar</td><td>10<sup>14</sup> m</td></tr>\n<tr><td>Tierra</td><td>10<sup>7</sup> m</td></tr>\n<tr><td>Un árbol</td><td>10 m</td></tr>\n<tr><td>Una mosca</td><td>10<sup>-2</sup> m</td></tr>\n<tr><td>Célula humana</td><td>10<sup>-4</sup> m</td></tr>\n<tr><td>ADN</td><td>10<sup>-9</sup> m</td></tr>\n<tr><td><b>Átomo de hidrógeno</b></td><td><b>10<sup>-10</sup> m</b></td></tr>\n<tr><td><b>Núcleo de plomo</b></td><td><b>10<sup>-11</sup> m</b></td></tr>\n<tr><td><b>Protón y neutrón</b></td><td><b>10<sup>-15</sup> m</b></td></tr>\n</tbody></table></div>\n<figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_anatomia_vacio.jpg\" alt=\"Anatomia del vacio: el atomo y su nucleo a escala, con protones y neutrones\" loading=\"lazy\"><figcaption>El núcleo es unas 100.000 veces más pequeño que el átomo, pero concentra más del 99% de su masa: ahí es donde compiten las fuerzas del siguiente diagrama.</figcaption></figure><figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_batalla_nucleo.jpg\" alt=\"La batalla en el nucleo: fuerza de repulsion electromagnetica frente a fuerza nuclear fuerte\" loading=\"lazy\"><figcaption>Dentro del núcleo compiten dos fuerzas: la electromagnética separa los protones, la nuclear fuerte los mantiene unidos. Ese equilibrio es el hilo del siguiente objetivo.</figcaption></figure>\n<p>Un elemento químico queda definido por su número de protones: es lo que distingue al hidrógeno del uranio. Pero un mismo elemento puede tener distinto número de neutrones -esas variantes se llaman <b>isótopos</b>-. El hidrógeno normal tiene un protón y ningún neutrón; si añade un neutrón se llama deuterio, y con dos, tritio. Cada núcleo se identifica con su símbolo y su <b>número másico</b>, la suma de protones más neutrones: <sup>1</sup>H, <sup>2</sup>H, <sup>3</sup>H.</p>\n<p>El uranio funciona igual: su isótopo mayoritario en la naturaleza, el <sup>238</sup>U, tiene 92 protones y 146 neutrones. El isótopo que hace posible la fisión en las centrales nucleares, el <sup>235</sup>U, tiene los mismos 92 protones pero solo 143 neutrones. Ese pequeño cambio en el número de neutrones es lo que separa un combustible nuclear útil de un metal pesado corriente, y es el hilo que conecta este objetivo con los dos siguientes.</p>\n", "cards": [{"id": "od2-c1", "q": "Según la escala de tamaños del capítulo, ¿cómo es de grande el átomo de hidrógeno en relación con su núcleo?", "opts": ["El núcleo y el átomo tienen prácticamente el mismo tamaño, con una diferencia mínima", "El núcleo es unas 100.000 veces más pequeño que el átomo completo que lo contiene", "El átomo es solo diez veces mayor que su núcleo, una diferencia de un orden de magnitud", "El núcleo ocupa aproximadamente la mitad del volumen total que ocupa el átomo entero"], "correct": 1, "why": "El capítulo usa la comparación del balón de fútbol en el centro de un estadio: el núcleo de hidrógeno es unas 100.000 veces más pequeño que el átomo, lo que deja la materia prácticamente vacía."}, {"id": "od2-c2", "q": "¿Qué son los nucleones y de qué están compuestos a su vez?", "opts": ["Los electrones que orbitan el núcleo; a su vez están formados por fotones de muy baja energía", "Los isótopos de un mismo elemento químico; a su vez se distinguen solo por su número de protones", "Las partículas alfa emitidas en la desintegración; a su vez están formadas por dos electrones libres", "Los protones y neutrones del núcleo; a su vez están formados por partículas más pequeñas, los quarks"], "correct": 3, "why": "Nucleones es el nombre genérico de protones y neutrones, por formar el núcleo. Ninguno de los dos es indivisible: ambos están compuestos de quarks, partículas aún más elementales."}, {"id": "od2-c3", "q": "El <sup>235</sup>U y el <sup>238</sup>U son isótopos del mismo elemento. ¿En qué se diferencian exactamente?", "opts": ["Tienen el mismo número de protones (92) pero distinto número de neutrones en el núcleo", "Tienen el mismo número de neutrones pero distinto número de protones, lo que cambia el elemento", "Tienen el mismo número másico total pero una disposición distinta de sus electrones externos", "Uno de los dos no tiene núcleo definido, solo una nube difusa de neutrones sin protones"], "correct": 0, "why": "Ser isótopos del mismo elemento significa compartir el número de protones -eso es lo que define al uranio-, y diferir en el número de neutrones: 146 en el <sup>238</sup>U frente a 143 en el <sup>235</sup>U."}, {"id": "od2-c4", "q": "¿Qué indica el número másico que acompaña al símbolo de un isótopo, como en <sup>235</sup>U?", "opts": ["El número de electrones que orbitan alrededor del núcleo en su estado eléctricamente neutro", "La energía, en millones de electronvoltios, que libera ese isótopo al fisionarse por completo", "La suma total de protones y neutrones que contiene el núcleo de ese isótopo concreto", "El número de años que tarda ese isótopo en desintegrarse hasta la mitad de una muestra inicial"], "correct": 2, "why": "El número másico es protones más neutrones. Para el <sup>235</sup>U son 92 protones y 143 neutrones; no describe electrones, energía liberada ni periodo de semidesintegración, que son magnitudes distintas."}]}, {"id": "od3", "n": "3", "lvl": "analizar", "lvlLabel": "Analizar", "navTitle": "Radiactividad y estabilidad", "titulo": "Estabilidad nuclear y los cuatro procesos radiactivos", "objetivo": "Diferenciar los cuatro procesos radiactivos (alfa, beta negativa, beta positiva y gamma) y relacionar la estabilidad de un núcleo con su combinación de protones y neutrones.", "contentHtml": "\n<p class=\"lead\">De los cerca de 2.300 núcleos que se conocen, solo unos 300 son estables. El resto -inestables- buscan estabilidad transformándose mediante procesos radiactivos, y lo hacen de una de estas cuatro formas.</p>\n<p>La estabilidad depende del equilibrio entre dos fuerzas: los protones, al tener carga positiva, se repelen entre sí; pero a distancias muy pequeñas, dentro del núcleo, todas las partículas se atraen. Los neutrones no tienen carga, así que no añaden repulsión: cuantos más neutrones haya junto a los protones, más equilibrado queda ese balance. Por eso los núcleos pequeños son estables con un neutrón por cada protón, y los núcleos grandes necesitan cada vez más neutrones que protones para compensar la repulsión creciente.</p>\n<figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_curva_estabilidad.jpg\" alt=\"Curva de estabilidad: numero de protones frente a numero de neutrones\" loading=\"lazy\"><figcaption>Cada punto es un núcleo conocido: los que caen dentro de la banda naranja son estables, los que caen fuera se desintegran hasta alcanzar una combinación estable de protones y neutrones.</figcaption></figure>\n<figure class=\"figlb-able\" tabindex=\"0\"><svg viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"Comparativa de los cuatro procesos radiactivos: desintegración alfa, beta negativa, beta positiva y gamma\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Inter, Helvetica Neue, Arial, sans-serif\"><defs><marker id=\"arwp\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#B8C6D6\"/></marker></defs><rect width=\"1600\" height=\"900\" fill=\"#0B1622\"/><text x=\"48\" y=\"70\" font-size=\"40\" fill=\"#FFFFFF\" font-weight=\"600\">Cómo se desintegra un núcleo inestable</text><text x=\"48\" y=\"104\" font-size=\"22\" fill=\"#3EC9E8\">Cuatro estrategias para llegar a una combinación más estable de protones y neutrones</text><g><rect x=\"60\" y=\"180\" width=\"330\" height=\"620\" rx=\"16\" fill=\"#111F30\" fill-opacity=\"0.9\" stroke=\"#3EC9E8\" stroke-width=\"1.5\"/><text x=\"82\" y=\"222\" font-size=\"21\" fill=\"#3EC9E8\" font-weight=\"600\">ALFA</text><circle cx=\"225\" cy=\"330\" r=\"70\" fill=\"#1E3346\"/><circle cx=\"225\" cy=\"330\" r=\"70\" fill=\"none\" stroke=\"#3EC9E8\" stroke-width=\"2.5\"/><text x=\"225\" y=\"337\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\">Sobra masa</text><path d=\"M225 415 L225 470\" stroke=\"#3EC9E8\" stroke-width=\"2.5\" marker-end=\"url(#arwp)\"/><circle cx=\"225\" cy=\"560\" r=\"58\" fill=\"#1E3346\"/><circle cx=\"225\" cy=\"560\" r=\"58\" fill=\"none\" stroke=\"#3EC9E8\" stroke-width=\"2.5\"/><text x=\"225\" y=\"567\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"middle\">-2p -2n</text><text x=\"82\" y=\"662\" font-size=\"15.5\" fill=\"#E6EDF5\"><tspan x=\"82\" dy=\"0\">Expulsa una partícula alfa (2</tspan><tspan x=\"82\" dy=\"1.35em\">protones + 2 neutrones): el núcleo</tspan><tspan x=\"82\" dy=\"1.35em\">pierde masa de golpe.</tspan></text></g><g><rect x=\"430\" y=\"180\" width=\"330\" height=\"620\" rx=\"16\" fill=\"#111F30\" fill-opacity=\"0.9\" stroke=\"#FF4D8D\" stroke-width=\"1.5\"/><text x=\"452\" y=\"222\" font-size=\"21\" fill=\"#FF4D8D\" font-weight=\"600\">BETA NEGATIVA</text><circle cx=\"595\" cy=\"330\" r=\"70\" fill=\"#1E3346\"/><circle cx=\"595\" cy=\"330\" r=\"70\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2.5\"/><text x=\"595\" y=\"337\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\">Sobra neutrón</text><path d=\"M595 415 L595 470\" stroke=\"#FF4D8D\" stroke-width=\"2.5\" marker-end=\"url(#arwp)\"/><circle cx=\"595\" cy=\"560\" r=\"58\" fill=\"#1E3346\"/><circle cx=\"595\" cy=\"560\" r=\"58\" fill=\"none\" stroke=\"#FF4D8D\" stroke-width=\"2.5\"/><text x=\"595\" y=\"567\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"middle\">n -> p + e-</text><text x=\"452\" y=\"662\" font-size=\"15.5\" fill=\"#E6EDF5\"><tspan x=\"452\" dy=\"0\">Un neutrón se convierte en protón</tspan><tspan x=\"452\" dy=\"1.35em\">y electrón; el electrón sale del</tspan><tspan x=\"452\" dy=\"1.35em\">núcleo.</tspan></text></g><g><rect x=\"800\" y=\"180\" width=\"330\" height=\"620\" rx=\"16\" fill=\"#111F30\" fill-opacity=\"0.9\" stroke=\"#8FD14F\" stroke-width=\"1.5\"/><text x=\"822\" y=\"222\" font-size=\"21\" fill=\"#8FD14F\" font-weight=\"600\">BETA POSITIVA</text><circle cx=\"965\" cy=\"330\" r=\"70\" fill=\"#1E3346\"/><circle cx=\"965\" cy=\"330\" r=\"70\" fill=\"none\" stroke=\"#8FD14F\" stroke-width=\"2.5\"/><text x=\"965\" y=\"337\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\">Sobra protón</text><path d=\"M965 415 L965 470\" stroke=\"#8FD14F\" stroke-width=\"2.5\" marker-end=\"url(#arwp)\"/><circle cx=\"965\" cy=\"560\" r=\"58\" fill=\"#1E3346\"/><circle cx=\"965\" cy=\"560\" r=\"58\" fill=\"none\" stroke=\"#8FD14F\" stroke-width=\"2.5\"/><text x=\"965\" y=\"567\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"middle\">p -> n + e+</text><text x=\"822\" y=\"662\" font-size=\"15.5\" fill=\"#E6EDF5\"><tspan x=\"822\" dy=\"0\">Un protón se convierte en neutrón</tspan><tspan x=\"822\" dy=\"1.35em\">y positrón (electrón de carga</tspan><tspan x=\"822\" dy=\"1.35em\">positiva).</tspan></text></g><g><rect x=\"1170\" y=\"180\" width=\"330\" height=\"620\" rx=\"16\" fill=\"#111F30\" fill-opacity=\"0.9\" stroke=\"#FFC24B\" stroke-width=\"1.5\"/><text x=\"1192\" y=\"222\" font-size=\"21\" fill=\"#FFC24B\" font-weight=\"600\">GAMMA</text><circle cx=\"1335\" cy=\"330\" r=\"70\" fill=\"#1E3346\"/><circle cx=\"1335\" cy=\"330\" r=\"70\" fill=\"none\" stroke=\"#FFC24B\" stroke-width=\"2.5\"/><text x=\"1335\" y=\"337\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\">Sobra energía</text><path d=\"M1335 415 L1335 470\" stroke=\"#FFC24B\" stroke-width=\"2.5\" marker-end=\"url(#arwp)\"/><circle cx=\"1335\" cy=\"560\" r=\"58\" fill=\"#1E3346\"/><circle cx=\"1335\" cy=\"560\" r=\"58\" fill=\"none\" stroke=\"#FFC24B\" stroke-width=\"2.5\"/><text x=\"1335\" y=\"567\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"middle\">radiación</text><text x=\"1192\" y=\"662\" font-size=\"15.5\" fill=\"#E6EDF5\"><tspan x=\"1192\" dy=\"0\">El número de partículas no cambia:</tspan><tspan x=\"1192\" dy=\"1.35em\">solo se libera energía como</tspan><tspan x=\"1192\" dy=\"1.35em\">radiación electromagnética.</tspan></text></g><rect x=\"60\" y=\"820\" width=\"1440\" height=\"60\" rx=\"12\" fill=\"#111F30\" fill-opacity=\"0.85\" stroke=\"#2A4056\"/><text x=\"86\" y=\"857\" font-size=\"16.5\" fill=\"#B8C6D6\">El período de semidesintegración mide cuánto tarda en desintegrarse la mitad de una muestra: de microsegundos a miles de millones de años según el isótopo.</text></svg><figcaption>Cada proceso resuelve un desequilibrio distinto entre protones y neutrones; fíjate en qué partícula \"sobra\" antes de la flecha y qué emite el núcleo para deshacerse de ese exceso.</figcaption></figure>\n<p>Cuando a un núcleo le sobra masa para ser estable, expulsa una partícula alfa -dos protones y dos neutrones juntos, en la práctica un núcleo de helio-. Si lo que le sobra es un neutrón respecto a sus protones, ese neutrón se transforma en un protón y expulsa un electrón: es la desintegración beta negativa. Si le sobra un protón, ocurre lo simétrico: un protón se convierte en neutrón y expulsa un positrón, un electrón de carga positiva -desintegración beta positiva-. Y cuando el número de partículas ya es el correcto pero al núcleo le sobra energía, simplemente la libera como radiación electromagnética: es la desintegración gamma, sin cambiar ni un protón ni un neutrón de sitio.</p>\n<p>Cada isótopo inestable se desintegra a un ritmo propio, que se mide con el <b>periodo de semidesintegración</b>: el tiempo que tarda la mitad de una muestra en desintegrarse. No es un valor cualquiera -va de fracciones de segundo a miles de millones de años-, y determina cuánto tiempo hay que gestionar ese material como radiactivo.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Isótopo</th><th>Periodo de semidesintegración</th><th>Origen</th></tr></thead><tbody>\n<tr><td><sup>238</sup>U</td><td>4.470 millones de años</td><td>Natural</td></tr>\n<tr><td><sup>235</sup>U</td><td>704 millones de años</td><td>Natural</td></tr>\n<tr><td><sup>233</sup>Th</td><td>22,2 minutos</td><td>Artificial</td></tr>\n<tr><td><sup>239</sup>U</td><td>23,5 minutos</td><td>Artificial</td></tr>\n</tbody></table></div>\n<p>Cada tipo de radiación se detiene con un blindaje distinto, y esa diferencia es la que determina cómo se protege a las personas: una simple hoja de papel o la propia piel detienen una partícula alfa; unos pocos milímetros de aluminio detienen una partícula beta; pero la radiación gamma, al ser electromagnética y muy penetrante, solo se atenúa de forma apreciable con espesores gruesos de hormigón o plomo.</p>\n<figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_espectro_penetracion.jpg\" alt=\"Espectro de penetracion de las radiaciones alfa, beta, gamma y neutrones frente a distintos blindajes\" loading=\"lazy\"><figcaption>Cada radiación llega hasta donde su masa y su carga le permiten: la alfa apenas atraviesa una hoja de papel, la gamma y los neutrones exigen blindajes mucho más gruesos.</figcaption></figure>\n<div class=\"callout\"><span class=\"ic\">CSN</span><p>Según el <b>Consejo de Seguridad Nuclear (CSN)</b>, la dosis media anual que recibe una persona en España por radiación natural es de <b>2,41 mSv</b>: 0,39 mSv de radiación cósmica, 1,15 mSv de radón, 0,48 mSv de radiación terrestre y el resto de fuentes internas del propio cuerpo. El CSN señala que no hay evidencia de efectos sobre la salud por debajo de 100 mSv al año, y que esta misma radiactividad tiene aplicaciones cotidianas: diagnóstico médico, esterilización de material sanitario y datación por carbono-14.</p></div>\n<div class=\"callout\"><span class=\"ic\">Nota</span><p>La fisión -un núcleo pesado que se rompe en dos- es en realidad el quinto proceso radiactivo, y es tan central para esta unidad que merece su propio objetivo: es lo que se trata a continuación.</p></div>\n", "cards": [{"id": "od3-c1", "q": "¿Qué combinación de protones y neutrones hace que un núcleo pequeño sea estable, según el capítulo?", "opts": ["Un número de protones muy superior al número de neutrones, para maximizar la carga positiva total", "Un núcleo formado casi por completo por neutrones, con muy pocos protones que aporten repulsión eléctrica", "Un número de neutrones aproximadamente igual al número de protones, sin apenas exceso de ninguno", "Un número de neutrones que crece de forma proporcional al cuadrado del número de protones"], "correct": 2, "why": "Para núcleos pequeños, la mejor combinación es aproximadamente un neutrón por protón: los neutrones añaden atracción a corta distancia sin sumar repulsión eléctrica, y ese equilibrio es el que da estabilidad."}, {"id": "od3-c2", "q": "Un núcleo tiene un neutrón de más respecto al equilibrio que necesita. ¿Qué proceso radiactivo sigue con más probabilidad?", "opts": ["Desintegración beta positiva: un protón se transforma en neutrón y expulsa un positrón del núcleo", "Desintegración alfa: el núcleo expulsa de golpe dos protones y dos neutrones para perder masa", "Desintegración gamma: el núcleo libera el exceso como radiación electromagnética sin cambiar partículas", "Desintegración beta negativa: el neutrón sobrante se transforma en protón y expulsa un electrón"], "correct": 3, "why": "Cuando sobra un neutrón, ese neutrón se convierte en protón y el núcleo expulsa un electrón: es exactamente la desintegración beta negativa. La beta positiva resuelve el caso contrario, sobra de protón."}, {"id": "od3-c3", "q": "¿Qué distingue a la desintegración gamma de las otras tres desintegraciones vistas en este objetivo?", "opts": ["Que solo ocurre en núcleos artificiales creados en laboratorio, rara vez en isótopos de origen natural", "Que el núcleo ya tiene el número correcto de protones y neutrones y solo libera un exceso de energía", "Que el núcleo emite dos protones y dos neutrones juntos en forma de una única partícula pesada", "Que transforma simultáneamente un protón en neutrón y un neutrón en protón dentro del mismo núcleo"], "correct": 1, "why": "En la desintegración gamma el número de nucleones no cambia: el núcleo ya tiene la combinación correcta de protones y neutrones, y lo único que le sobra es energía, que libera como radiación electromagnética."}, {"id": "od3-c4", "q": "El <sup>235</sup>U tiene un periodo de semidesintegración de 704 millones de años. ¿Qué significa exactamente ese dato?", "opts": ["Que el <sup>235</sup>U deja de ser radiactivo por completo pasados exactamente 704 millones de años", "Que hacen falta 704 millones de años para que un solo átomo de <sup>235</sup>U emita su primera partícula", "Que la energía liberada por cada fisión de <sup>235</sup>U tarda 704 millones de años en disiparse", "Que en 704 millones de años se habrá desintegrado la mitad de los átomos de una muestra de <sup>235</sup>U"], "correct": 3, "why": "El periodo de semidesintegración es el tiempo en que la mitad de los átomos de una muestra se desintegran, no el tiempo hasta que 'termina' la radiactividad ni el tiempo hasta la primera desintegración de un átomo aislado."}, {"id": "od3-c5", "q": "Un técnico necesita detener radiación gamma procedente de una fuente industrial. Según el capítulo, ¿qué blindaje es el adecuado?", "opts": ["Un espesor grueso de hormigón o plomo, porque la radiación gamma es electromagnética y muy penetrante", "Una hoja de papel o la propia ropa de trabajo, suficiente para detener cualquier radiación electromagnética", "Unos pocos milímetros de aluminio, el mismo material que basta para detener las partículas beta", "Un guante de látex, porque la radiación gamma se detiene con cualquier barrera física por fina que sea"], "correct": 2, "why": "El capítulo distingue tres blindajes según el tipo de radiación: papel o piel para alfa, milímetros de aluminio para beta, y espesores gruesos de hormigón o plomo para gamma, por ser electromagnética y muy penetrante."}, {"id": "od3-c6", "q": "Según los datos del CSN citados en el capítulo, ¿cuál es la principal fuente de la dosis media anual de radiación natural que recibe una persona en España?", "opts": ["La radiación cósmica, con 0,39 mSv al año frente a los 1,15 mSv del radón", "La radiación terrestre, con 0,48 mSv al año frente a los 1,15 mSv del radón", "El radón, con 1,15 mSv al año frente a los 0,39 mSv de la radiación cósmica", "Las fuentes internas del propio cuerpo, con más dosis anual que el radón y la radiación terrestre juntos"], "correct": 2, "why": "De los 2,41 mSv anuales de media que cita el CSN, el radón aporta 1,15 mSv, más que la radiación cósmica (0,39 mSv) y la terrestre (0,48 mSv) por separado: es el mayor componente individual de la dosis natural."}]}, {"id": "od4", "n": "4", "lvl": "comprender", "lvlLabel": "Comprender", "navTitle": "Fisión y fusión", "titulo": "Fisión y fusión: dos formas de liberar la energía del núcleo", "objetivo": "Distinguir la fisión de la fusión nuclear y explicar, a partir de E=mc², por qué ambas liberan energía.", "contentHtml": "\n<p class=\"lead\">Fisión y fusión son procesos opuestos -uno rompe núcleos pesados, el otro une núcleos ligeros- pero comparten el mismo origen físico: ambos liberan energía porque el resultado final tiene menos masa que el punto de partida, y esa masa que falta se transforma en energía según la ecuación de Einstein, E=mc².</p>\n<figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_defecto_masa.jpg\" alt=\"Balanza mostrando el defecto de masa entre reactivos y productos, con E igual a m c al cuadrado\" loading=\"lazy\"><figcaption>La masa que falta al pesar los productos no se pierde: es la energía que libera la reacción, calculada con E=mc².</figcaption></figure>\n<figure class=\"figlb-able\" tabindex=\"0\"><svg viewBox=\"0 0 1200 620\" role=\"img\" aria-label=\"Animacion en bucle de un nucleo de uranio-235 que captura un neutron y se fisiona liberando dos fragmentos, fotones gamma de energia y, alternando, dos o tres neutrones nuevos\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Inter, Helvetica Neue, Arial, sans-serif\"><defs><radialGradient id=\"protonG\" cx=\"35%\" cy=\"30%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#FF8FB4\"/><stop offset=\"100%\" stop-color=\"#FF4D8D\"/></radialGradient><radialGradient id=\"neutronG\" cx=\"35%\" cy=\"30%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#8FD9FF\"/><stop offset=\"100%\" stop-color=\"#5AA9FF\"/></radialGradient><radialGradient id=\"flashG\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0%\" stop-color=\"#FFF6DC\" stop-opacity=\"0.95\"/><stop offset=\"55%\" stop-color=\"#FFC24B\" stop-opacity=\"0.55\"/><stop offset=\"100%\" stop-color=\"#FFC24B\" stop-opacity=\"0\"/></radialGradient><style><![CDATA[\n  .core{animation: coreFade 12s linear infinite}\n  @keyframes coreFade {\n    0%{opacity:1} 13.5%{opacity:1} 16.5%{opacity:0} 50%{opacity:0}\n    50.1%{opacity:1} 63.5%{opacity:1} 66.5%{opacity:0} 100%{opacity:0}\n  }\n  .neutronIn{animation: nIn 12s linear infinite}\n  @keyframes nIn {\n    0%{transform:translateX(-430px); opacity:1} 13.5%{transform:translateX(0px); opacity:1}\n    14.5%{opacity:0} 50%{opacity:0}\n    50.1%{transform:translateX(-430px); opacity:1} 63.5%{transform:translateX(0px); opacity:1}\n    64.5%{opacity:0} 100%{opacity:0}\n  }\n  .flash{animatio ill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"586\" cy=\"352\" r=\"17\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"554\" cy=\"306\" r=\"17\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"620\" cy=\"280\" r=\"17\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"596\" cy=\"306\" r=\"17\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"630\" cy=\"324\" r=\"17\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"576\" cy=\"270\" r=\"17\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/></g><circle class=\"flash\" cx=\"600\" cy=\"310\" r=\"140\" fill=\"url(#flashG)\"/><g class=\"photonA\"><path d=\"M 607.4 304.8 L 584.6 303.7 L 591.3 281.9 L 568.5 280.8 L 575.3 259.0 L 552.5 257.8\" fill=\"none\" stroke=\"#B47BF0\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"photonB\"><path d=\"M 607.4 315.2 L 600.7 293.4 L 623.4 292.2 L 616.7 270.4 L 639.5 269.3 L 632.8 247.5\" fill=\"none\" stroke=\"#B47BF0\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g class=\"fragL\"><circle cx=\"584\" cy=\"298\" r=\"15\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"610\" cy=\"292\" r=\"15\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"618\" cy=\"316\" r=\"15\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"582\" cy=\"320\" r=\"15\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"602\" cy=\"314\" r=\"15\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"608\" cy=\"330\" r=\"15\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/></g><g class=\"fragR\"><circle cx=\"584\" cy=\"298\" r=\"15\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"610\" cy=\"292\" r=\"15\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"618\" cy=\"316\" r=\"15\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"582\" cy=\"320\" r=\"15\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"602\" cy=\"314\" r=\"15\" fill=\"url(#protonG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle cx=\"608\" cy=\"330\" r=\"15\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/></g><circle class=\"nOut1\" cx=\"600\" cy=\"310\" r=\"11\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle class=\"nOut2\" cx=\"600\" cy=\"310\" r=\"11\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/><circle class=\"nOut3\" cx=\"600\" cy=\"310\" r=\"11\" fill=\"url(#neutronG)\" stroke=\"#0B1622\" stroke-width=\"1.5\"/></g><text class=\"lbl1\" x=\"600\" y=\"540\" font-size=\"24\" fill=\"#E6EDF5\" text-anchor=\"middle\">Un neutrón impacta un núcleo de <tspan fill=\"#5AA9FF\" font-weight=\"600\">²³⁵U</tspan></text><text class=\"lbl2a\" x=\"600\" y=\"540\" font-size=\"24\" fill=\"#FFC24B\" text-anchor=\"middle\" font-weight=\"600\">Fisión: 2 fragmentos + 2 neutrones + fotones γ (≈200 MeV)</text><text class=\"lbl2b\" x=\"600\" y=\"540\" font-size=\"24\" fill=\"#FFC24B\" text-anchor=\"middle\" font-weight=\"600\">Fisión: 2 fragmentos + 3 neutrones + fotones γ (≈200 MeV)</text></svg><figcaption>La animación se repite en dos fases: unas veces libera 2 neutrones y otras 3, pero siempre con energía y fotones gamma (≈200 MeV).</figcaption></figure>\n<p><b>Fusión nuclear.</b> Dos núcleos atómicos ligeros se unen para formar un núcleo más pesado, cuya masa es inferior a la suma de las masas de los dos núcleos originales. Ese defecto de masa es la energía liberada. La reacción de fusión con más futuro para uso energético combina dos isótopos del hidrógeno, deuterio y tritio, para formar helio y liberar un neutrón de alta energía:</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Reactivos</th><th>Productos</th></tr></thead><tbody>\n<tr><td>Deuterio (<sup>2</sup>H) + Tritio (<sup>3</sup>H)</td><td>Helio-4 (3,5 MeV) + neutrón (14,1 MeV)</td></tr>\n</tbody></table></div>\n<p>Es la reacción que alimenta al Sol y a las estrellas, pero conseguirla de forma sostenida y aprovechable en la Tierra exige confinar el combustible a temperaturas de millones de grados: la investigación lleva más de cincuenta años en marcha sin lograr todavía una central de fusión comercial.</p>\n<div class=\"callout\"><span class=\"ic\">OIEA</span><p>Según el <b>Organismo Internacional de Energía Atómica (OIEA)</b>, conseguir la fusión de forma sostenida exige calentar el combustible -deuterio y tritio- hasta unos <b>100 millones de grados</b>, muy por encima de la temperatura del núcleo solar, porque en la Tierra no se dispone de la presión gravitatoria que ayuda a las estrellas a fusionar a temperaturas más bajas. Para lograrlo se ensayan dos vías de confinamiento: el <b>confinamiento magnético</b>, que atrapa el plasma con campos magnéticos en un reactor en forma de anillo -un tokamak, como el proyecto internacional ITER-, y el <b>confinamiento inercial</b>, que comprime una pequeña cápsula de combustible con potentes láseres. El OIEA calcula que la energía contenida en el deuterio extraíble de un litro de agua de mar equivale a la de unos 300 litros de petróleo.</p></div>\n<p><b>Fisión nuclear.</b> Un núcleo atómico pesado se divide en dos núcleos más pequeños, emitiendo además neutrones, rayos gamma y otras partículas. El núcleo pesado inicial pesa más que la suma de los dos fragmentos en que se divide, y de nuevo ese exceso de masa se transforma en energía. Aunque existen fisiones espontáneas, la forma habitual de inducirla es enviar un neutrón con la energía adecuada contra un núcleo fisionable -por ejemplo <sup>235</sup>U-: el núcleo captura el neutrón, se vuelve muy inestable y se divide en dos fragmentos, liberando a su vez varios neutrones nuevos de alta energía. No todos los núcleos pesados son fisionables por cualquier neutrón; solo unos pocos, como el <sup>233</sup>U, el <sup>235</sup>U o el <sup>239</sup>Pu, cumplen esa condición.</p>\n<figure class=\"figlb-able\" tabindex=\"0\"><img src=\"slide_fision_fusion.jpg\" alt=\"Tabla comparativa entre fision y fusion nuclear: mecanismo, combustible, rendimiento, residuos y estado tecnologico\" loading=\"lazy\"><figcaption>Mismo origen físico -el defecto de masa-, pero procesos, combustibles y estado de desarrollo tecnológico muy distintos.</figcaption></figure>\n<p>Esta es la reacción con la que trabaja este curso: es la que hace posible que las centrales nucleares generen calor de forma continua, y esos neutrones nuevos que libera cada fisión son la clave del objetivo siguiente.</p>\n", "cards": [{"id": "od4-c1", "q": "¿Qué tienen en común la fisión y la fusión nuclear, según el capítulo?", "opts": ["Que ambas dividen un núcleo pesado en dos fragmentos de menor masa liberando energía por igual", "Que ambas necesitan millones de grados de temperatura para liberar su energía de forma sostenida", "Que ambas liberan energía porque el resultado final tiene menos masa que los núcleos de partida", "Que ambas se explotan hoy de forma comercial y aportan energía a las centrales nucleares en España"], "correct": 2, "why": "Fisión y fusión son procesos opuestos -uno divide, el otro une-, pero en los dos el producto final pesa menos que el punto de partida, y esa masa perdida se convierte en energía según E=mc². La fusión, además, no está aún explotada comercialmente."}, {"id": "od4-c2", "q": "En la reacción deuterio + tritio, ¿qué le ocurre a la masa total al pasar de reactivos a productos?", "opts": ["La masa total se mantiene exactamente igual, porque el helio-4 conserva toda la masa del deuterio y el tritio", "La masa de los productos aumenta, porque el neutrón liberado añade masa nueva al sistema completo", "La masa de los productos (helio y neutrón) es menor que la de los dos isótopos de hidrógeno iniciales", "La masa solo cambia si la reacción ocurre dentro de una estrella y no en un laboratorio terrestre"], "correct": 2, "why": "El helio-4 y el neutrón resultantes pesan, juntos, menos que el deuterio y el tritio de partida. Ese defecto de masa es precisamente lo que se libera como energía, 3,5 y 14,1 MeV respectivamente."}, {"id": "od4-c3", "q": "Para que un núcleo de <sup>235</sup>U se fisione al capturar un neutrón, ¿qué condición señala el capítulo como necesaria?", "opts": ["Que el núcleo de <sup>235</sup>U esté previamente unido a otro núcleo de <sup>235</sup>U en la misma muestra", "Que el neutrón llegue con una velocidad -una energía- adecuada para que el núcleo lo capture", "Que el neutrón proceda de una desintegración beta y no de una fisión previa de otro núcleo", "Que la temperatura del entorno supere los mismos millones de grados que necesita la fusión"], "correct": 1, "why": "El texto precisa que se envía un neutrón con la energía adecuada; no cualquier núcleo pesado captura cualquier neutrón y fisiona: solo unos pocos isótopos como el <sup>235</sup>U cumplen esa condición, y la energía del neutrón importa."}, {"id": "od4-c4", "q": "Según el OIEA, ¿por qué hace falta calentar el combustible de fusión a temperaturas muy superiores a las del núcleo del Sol para conseguir fusión en la Tierra?", "opts": ["Porque en la Tierra no existe la presión gravitatoria que ayuda a las estrellas a fusionar con menos calor", "Porque el deuterio terrestre es un isótopo distinto del que se fusiona de forma natural en el interior del Sol", "Porque los reactores de fusión terrestres usan tritio en vez de helio, que exige más temperatura para reaccionar", "Porque la fusión en la Tierra libera menos energía por reacción que la fusión que ocurre dentro de las estrellas"], "correct": 0, "why": "El OIEA señala que hacen falta unos 100 millones de grados en la Tierra, muy por encima de la temperatura solar, precisamente porque falta la presión gravitatoria que en el Sol facilita la fusión a temperaturas más bajas."}, {"id": "od4-c5", "q": "¿Qué diferencia hay entre el confinamiento magnético y el confinamiento inercial, las dos vías de fusión que cita el OIEA?", "opts": ["El magnético comprime el combustible con láseres; el inercial lo atrapa con campos magnéticos en un tokamak", "El magnético atrapa el plasma con campos magnéticos en un reactor en anillo; el inercial comprime una cápsula con láseres", "El magnético solo se ensaya en laboratorio; el inercial es la única vía usada en proyectos como ITER", "El magnético y el inercial son en realidad el mismo método, con distinto nombre según el país que lo desarrolla"], "correct": 1, "why": "Son dos vías distintas: el confinamiento magnético usa campos magnéticos en un reactor en forma de anillo -un tokamak, como ITER-, y el confinamiento inercial comprime una pequeña cápsula de combustible con potentes láseres."}]}, {"id": "od5", "n": "5", "lvl": "aplicar", "lvlLabel": "Aplicar", "navTitle": "Reacción en cadena", "titulo": "Cómo se inicia y se controla una reacción en cadena", "objetivo": "Explicar cómo se inicia y se controla una reacción en cadena de fisión en un reactor nuclear, identificando el papel del moderador y de las barras de control.", "contentHtml": "\n<p class=\"lead\">Una sola fisión libera energía, pero no sostiene nada por sí sola. Lo que hace que un reactor nuclear produzca calor de forma continua es que cada fisión libera nuevos neutrones capaces de provocar fisiones siguientes: una <b>reacción en cadena</b>.</p>\n<figure class=\"figlb-able\" tabindex=\"0\"><svg viewBox=\"0 0 1600 940\" role=\"img\" aria-label=\"Reaccion en cadena de fision: un neutron fisiona un nucleo de uranio-235 que libera energia, fotones gamma y varios neutrones nuevos, cada uno capaz de fisionar otro nucleo\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Inter, Helvetica Neue, Arial, sans-serif\"><defs><marker id=\"arwc
